<!DOCTYPE html>
<html lang="fi">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FMI Havaintopisteet</title>
<link rel="icon" href="data:,">

<style>

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #f2f3f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #222;
  }

  /* ==========================
     Yläpalkki
     ========================== */

  .app-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #1a4d7a;
    color: #fff;
    padding: 14px 16px calc(14px + env(safe-area-inset-top, 0px));
    padding-top: max(14px, env(safe-area-inset-top, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  .app-header h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
  }

  .app-header a {
    color: #cfe4f7;
    font-size: 12px;
    text-decoration: none;
  }

  .app-header a:hover {
    text-decoration: underline;
  }

  /* ==========================
     Merialuelistaus
     ========================== */

  .station-list-wrapper {
    padding: 8px 0 24px;
  }

  .sea-area-section {
    margin-bottom: 4px;
  }

  .sea-area-title {
    position: sticky;
    top: 52px;
    margin: 0;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #555;
    background: #e8eaee;
    border-bottom: 1px solid #dcdfe4;
  }

  .station-list {
    list-style: none;
    margin: 0;
    padding: 0;
    background: #fff;
  }

  .station-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    min-height: 54px;
    padding: 12px 16px;
    border: none;
    border-bottom: 1px solid #eee;
    background: #fff;
    font-size: 18px;
    color: #222;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: rgba(0,0,0,0.06);
  }

  .station-item:active {
    background: #f0f2f5;
  }

  .station-item-name {
    flex: 1;
  }

  .station-item-preview {
    font-size: 13px;
    color: #777;
    margin-right: 8px;
    white-space: nowrap;
  }

  .station-item-chevron {
    color: #aaa;
    font-size: 20px;
    line-height: 1;
  }

  .empty-note {
    padding: 40px 20px;
    text-align: center;
    color: #888;
    font-size: 14px;
  }

  /* ==========================
     Asemakortin "bottom sheet"
     ========================== */

  .detail-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .detail-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .detail-sheet {
    position: relative;
    width: 100%;
    max-width: 560px;
    max-height: 92vh;
    background: #f2f3f5;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.25);
    overflow-y: auto;
    padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
    transform: translateY(100%);
    transition: transform 0.25s ease;
  }

  .detail-overlay.open .detail-sheet {
    transform: translateY(0);
  }

  /* Sulkupalkki pysyy aina näkyvissä ylhäällä skrollattaessa
     (puhelimen "back"-nappula ei sulje overlayta, joten sulku
     täytyy pystyä tekemään aina näkyvästä napista). */
  .detail-sheet-header {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    justify-content: flex-end;
    padding: 10px 0;
    padding-top: max(10px, env(safe-area-inset-top, 0px));
    background: #f2f3f5;
    border-bottom: 1px solid #e2e4e8;
    margin-bottom: 8px;
  }

  .detail-close {
    display: flex;
    align-items: center;
    gap: 6px;
    border: none;
    border-radius: 20px;
    background: #1a4d7a;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 8px 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: rgba(0,0,0,0.1);
  }

  .detail-close:hover,
  .detail-close:active {
    background: #143c60;
  }

  .detail-close-icon {
    font-size: 14px;
    line-height: 1;
  }

  /* ==========================
     Asemakortin sisältö (jaettu desktop-popupin kanssa,
     ks. js/popup/stationDetail.js)
     ========================== */

  .popup-title {
    font-weight: bold;
    font-size: 17px;
    margin-bottom: 6px;
  }

  .popup-card {
    background: #e8eef5;
    border: 1px solid #c5d5e3;
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    box-sizing: border-box;
  }

  .popup-card-inner {
    background: #e8eef5;
    border: 1px solid #c5d5e3;
    border-radius: 8px;
    padding: 6px 8px;
    box-sizing: border-box;
  }

  /* Lämpötila/Vedenkorkeus/Aallokko/Sää-kortit ovat nyt itsenäisiä,
     pinottuja "top-level"-kortteja (eivät enää sivupalkin sisällä),
     joten niille annetaan samat mitat kuin .popup-card:lle. */
  .mobile-stack-card {
    border-radius: 12px;
    padding: 10px 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .popup-note {
    background: #fff8e1;
    border: 1px solid #f0dfa0;
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.4;
    color: #6b5900;
    margin-bottom: 12px;
    box-sizing: border-box;
  }

  .popup-chart {
    width: 100% !important;
    max-width: 100%;
    height: 160px !important;
  }

  .popup-extras {
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 13px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }

  .popup-pressure {
    font-size: 0.9rem;
    color: #222;
    white-space: nowrap;
  }

  .popup-pressure--na {
    opacity: 0.6;
    font-style: italic;
  }

  .wind-flow-sealevel-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    line-height: 1.3;
  }

  .wind-flow-sealevel-label {
    font-size: 10px;
    color: #888;
    min-width: 52px;
    white-space: nowrap;
  }

  .wind-flow-sealevel-value {
    font-size: 14px;
    font-weight: 700;
    color: #1a4d7a;
    white-space: nowrap;
  }

  .popup-icon {
    width: 18px;
    height: 18px;
    display: block;
  }

  .popup-inline-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .popup-inline-item:not(:first-child)::before {
    content: "";
    border-left: 1px solid rgba(0,0,0,0.25);
    height: 14px;
    margin: 0 8px;
  }

  .popup-temp-value {
    font-size: 22px;
    font-weight: 700;
    color: #c62828;
    line-height: 1.1;
  }

  .popup-sun-row {
    display: flex;
    gap: 18px;
    margin-top: 4px;
    font-size: 14px;
  }

  .popup-hourly-day {
    margin-top: 8px;
    font-size: 10px;
    font-weight: 600;
    color: #666;
  }

  .popup-hourly-forecast {
    display: flex;
    gap: 2px;
    margin-top: 3px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .popup-hourly-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 0 0 auto;
    width: 30px;
    gap: 2px;
  }

  .popup-hourly-hour {
    font-size: 10px;
    color: #555;
  }

  .popup-hourly-icon {
    width: 22px;
    height: 22px;
    display: block;
  }

  .popup-hourly-temp {
    font-size: 11px;
    font-weight: 700;
    color: #c62828;
  }

  .popup-wave-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-top: 2px;
  }

  .popup-wave-height-value {
    font-size: 14px;
    font-weight: 700;
    color: #1a4d7a;
  }

  .popup-wave-period-label {
    font-size: 11px;
    color: #888;
  }

  .popup-wave-period-value {
    font-weight: 600;
    color: #444;
  }

  .wind-flow-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    width: 100%;
    margin-top: 6px;
  }

  .wind-flow-btn {
    padding: 5px 8px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    text-align: center;
    border: 1px solid #999;
    border-radius: 4px;
    background: #fff;
    color: #333;
    cursor: pointer;
  }

  .wind-flow-btn.active {
    background: #222;
    color: #fff;
    border-color: #222;
  }

  .wind-flow-ticks span {
    font-size: 10px;
    color: #888;
  }

  /* ==========================
     Mobiilin oma asemakortti (js/popup/mobileStationDetail.js)
     – pinotut kortit, ei desktopin sivupalkkilayoutia, ei
     kiinteitä pikselileveyksiä tai attribuuttivalitsimia.
     ========================== */

  .mobile-stack-card {
    margin-bottom: 10px;
  }

  .mobile-card-label {
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 2px;
    color: #444;
  }

  /* Tuuliennusteanimaatio: neliömäinen kanvaasi, sen alla
     liukusäädin ja tuntinapit peräkkäisinä lohkoina – ei enää
     riippuvainen ympäröivän flex-rivin absoluuttisesti
     sijoitetuista lapsista. */

  .wind-flow-title-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }

  .wind-flow-title-row .wind-flow-speed-label {
    font-size: 12px;
    font-weight: bold;
    color: #444;
  }

  .wind-flow-wrapper {
    position: relative;
    width: 100%;
    max-width: 320px;
    aspect-ratio: 1 / 1;
    margin: 0 auto;
  }

  .wind-flow-bg,
  .wind-flow-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .wind-flow-slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    width: 100%;
    max-width: 320px;
    margin-left: auto;
    margin-right: auto;
  }

  .wind-flow-slider-row .wind-flow-slider {
    flex: 1;
  }

  .wind-flow-slider-row .wind-flow-time-label {
    font-size: 12px;
    color: #444;
    min-width: 78px;
    text-align: right;
  }

  .wind-flow-ticks-row {
    width: 100%;
    max-width: 320px;
    margin: 0 auto;
  }

  .wind-flow-ticks {
    display: flex;
    justify-content: space-between;
  }

  /* Tuulen tekstimuotoinen aikajana */

  .wind-timeline-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .wind-charts-toggle {
    font-size: 12px;
    color: #1a4d7a;
    text-decoration: none;
  }

  .wind-charts-toggle:hover {
    text-decoration: underline;
  }

  .wind-charts-panel {
    margin-bottom: 10px;
  }

  .wind-timeline-list {
    max-height: 260px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    border-top: 1px solid #eee;
  }

  .wind-timeline-day {
    position: sticky;
    top: 0;
    background: #f2f3f5;
    font-size: 11px;
    font-weight: 700;
    color: #666;
    padding: 4px 2px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .wind-timeline-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 2px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 16px;
  }

  .wind-timeline-row-now {
    background: #eef5ff;
    border-radius: 6px;
    font-weight: 700;
  }

  .wind-timeline-time {
    min-width: 54px;
    color: #444;
  }

  .wind-timeline-arrow {
    display: inline-block;
    width: 20px;
    text-align: center;
    color: #1a4d7a;
    font-size: 18px;
  }

  .wind-timeline-arrow-empty {
    color: #bbb;
  }

  .wind-timeline-speed {
    color: #222;
  }

  .wind-timeline-empty {
    padding: 12px 2px;
    color: #888;
    font-size: 15px;
  }

</style>

</head>

<body>

  <header class="app-header">
    <h1>🌊 FMI Havaintopisteet</h1>
  </header>

  <main class="station-list-wrapper" id="station-list"></main>

  <div class="detail-overlay" id="detail-overlay">
    <div class="detail-sheet" id="detail-sheet">
      <div class="detail-sheet-header">
        <button type="button" class="detail-close" id="detail-close" aria-label="Sulje havaintoasema">
          <span class="detail-close-icon">✕</span>
          <span>Sulje</span>
        </button>
      </div>
      <div id="detail-sheet-body"></div>
    </div>
  </div>

<!-- Chart.js UMD (tuuligraafit) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>

<!-- Omat tiedostot -->
<script src="js/stations.js"></script>
<script type="module" src="js/mobile.js"></script>

</body>
</html>
