<!DOCTYPE html>
<html lang="fi">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FMI Havaintopisteet</title>
<link rel="icon" href="data:,">

<style>

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #f2f3f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #222;
  }

  /* ==========================
     Yläpalkki
     ========================== */

  .app-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #1a4d7a;
    color: #fff;
    padding: 14px 16px calc(14px + env(safe-area-inset-top, 0px));
    padding-top: max(14px, env(safe-area-inset-top, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  /* Logo korvaa aiemman "FMI Havaintopisteet" -tekstiotsikon.
     28px näyttökorkeus, kuva itse tallennettu 2x-resoluutiona
     (56px) retina-näyttöjä varten – height:auto pitää kuvasuhteen. */
  .app-header-logo {
    display: block;
    height: 28px;
    width: auto;
  }

  .app-header a {
    color: #cfe4f7;
    font-size: 12px;
    text-decoration: none;
  }

  .app-header a:hover {
    text-decoration: underline;
  }

  /* ==========================
     Merialuelistaus
     ========================== */

  .station-list-wrapper {
    padding: 8px 0 24px;
  }

  .sea-area-section {
    margin-bottom: 4px;
  }

  .sea-area-title {
    position: sticky;
    top: 52px;
    margin: 0;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #555;
    background: #e8eaee;
    border-bottom: 1px solid #dcdfe4;
  }

  .station-list {
    list-style: none;
    margin: 0;
    padding: 0;
    background: #fff;
  }

  .station-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    min-height: 54px;
    padding: 12px 16px;
    border: none;
    border-bottom: 1px solid #eee;
    background: #fff;
    font-size: 18px;
    color: #222;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: rgba(0,0,0,0.06);
  }

  .station-item:active {
    background: #f0f2f5;
  }

  .station-item-name {
    flex: 1;
  }

  .station-item-preview {
    font-size: 13px;
    color: #777;
    margin-right: 8px;
    white-space: nowrap;
  }

  .station-item-chevron {
    color: #aaa;
    font-size: 20px;
    line-height: 1;
  }

  .empty-note {
    padding: 40px 20px;
    text-align: center;
    color: #888;
    font-size: 14px;
  }

  /* ==========================
     Asemakortin "bottom sheet"
     ========================== */

  .detail-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .detail-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  /* Liu'utuskääre: HUOM tämä on tarkoituksella ERI elementti kuin
     .detail-sheet (skrollattava sisältö). Safarissa (mm. iPhone)
     position:sticky menee satunnaisesti rikki, jos sen skrollattava
     esi-isä-elementti itse sisältää transformin/transition-
     animaation – juuri tämä aiheutti "Sulje"-napin ajoittaisen
     katoamisen/väärän sijainnin. Kun transform on erillisessä,
     ei-skrollattavassa kääre-elementissä, .detail-sheet-headerin
     sticky-sijoittelu pysyy Safarissakin luotettavana. */
  .detail-sheet-slide {
    position: relative;
    width: 100%;
    max-width: 560px;
    transform: translateY(100%);
    transition: transform 0.25s ease;
  }

  .detail-overlay.open .detail-sheet-slide {
    transform: translateY(0);
  }

  .detail-sheet {
    /* 92vh iOS Safarissa lasketaan koko sivun (ml. selaimen
       kutistuvan osoiterivin alle piiloutuva alue) korkeudesta, ei
       oikeasti näkyvästä ruudusta. Kun osoiterivi on auki, kortti
       (ja sen sisällä "Sulje"-nappi) saattoi näin ylittää näkyvän
       ruudun ylälaidan – eikä sitä pystynyt skrollaamaan näkyviin,
       koska koko elementti on kiinteästi asemoitu, ei sivun
       normaalissa skrollivuossa. 92dvh mittaa aidosti näkyvän
       ruudun korkeuden ja päivittyy osoiterivin tilan mukaan; 92vh
       jätetään varalle selaimille, jotka eivät tue dvh-yksikköä. */
    max-height: 92vh;
    max-height: 92dvh;
    background: #f2f3f5;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.25);
    overflow-y: auto;
    padding: 0 16px calc(16px + env(safe-area-inset-bottom, 0px));
  }

  /* Sulkupalkki pysyy aina näkyvissä ylhäällä skrollattaessa
     (puhelimen "back"-nappula ei sulje overlayta, joten sulku
     täytyy pystyä tekemään aina näkyvästä napista). */
  .detail-sheet-header {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    justify-content: flex-end;
    padding: 10px 0;
    padding-top: max(10px, env(safe-area-inset-top, 0px));
    background: #f2f3f5;
    border-bottom: 1px solid #e2e4e8;
    margin-bottom: 8px;
  }

  .detail-close {
    display: flex;
    align-items: center;
    gap: 6px;
    border: none;
    border-radius: 20px;
    background: #1a4d7a;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    padding: 8px 16px;
    cursor: pointer;
    -webkit-tap-highlight-color: rgba(0,0,0,0.1);
  }

  .detail-close:hover,
  .detail-close:active {
    background: #143c60;
  }

  .detail-close-icon {
    font-size: 14px;
    line-height: 1;
  }

  /* ==========================
     Asemakortin sisältö (jaettu desktop-popupin kanssa,
     ks. js/popup/stationDetail.js)
     ========================== */

  .popup-title {
    font-weight: bold;
    font-size: 17px;
    margin-bottom: 6px;
  }

  /* ==========================
     Ylin yhteenvetokortti ("tämän hetkinen tilanne") – sama konsepti
     ja sama jaettu HTML/JS kuin desktopilla (index.html /
     js/popup/currentConditionsCard.js: currentConditionsCardHTML,
     renderCurrentWindSummary, renderCurrentSunTimes,
     updateMergedCardVisibility – EI mobiilikopiota näistä). Vain
     ulkoasu (tämä CSS-lohko) on mobiilikohtainen.

     Desktopilla alakortit (Tuuli, Lämpötila+Aurinko, Vedenkorkeus+
     Aallokko, Sääennuste) ovat 3 sarakkeen ruudukossa, koska popup on
     leveä (≥660px). Mobiilin kortti on kapeampi (tyypillisesti
     320-400px), joten 3 kapeaa saraketta olisi liian ahdas mm.
     pitkälle vedenkorkeusaseman nimelle ja tuulinuolikuplalle.
     Siksi mobiilissa KAIKKI alakortit pinotaan yhteen sarakkeeseen
     (samaan tapaan kuin muutkin mobiilin kortit) – sama HTML-
     rakenne, vain grid-template-columns eroaa desktopista.
     ========================== */

  /* Sama tummansininen kuin desktop-versiossa (index.html).
     HUOM: valitsin ".popup-card.popup-current-card" (molemmat
     luokat), EI pelkkää ".popup-current-card" – elementillä on aina
     molemmat luokat ("popup-card popup-current-card"), ja pelkkä
     yhden luokan valitsin on täsmälleen yhtä spesifinen kuin alempana
     oleva ".popup-card"-perussääntö. Koska ".popup-card" määritellään
     tiedostossa TÄMÄN säännön JÄLKEEN, se voitti aiemmin taustavärin
     (ja reunavärin) – siksi tausta ei näyttänyt vaihtuvan. Yhdistetty
     valitsin on spesifisyydeltään vahvempi ja voittaa aina
     järjestyksestä riippumatta. */
  .popup-card.popup-current-card {
    background: #1c3f5f;
    border-color: #0f2a44;
    color: #eaf1f8;
  }

  /* Vaaleansininen (ei valkoinen) sopii paremmin yhteen tummemman
     taustan kanssa kuin täysvalkoinen. */
  .popup-current-card .popup-title {
    color: #bfe0ff;
    font-size: 22px;
    margin-bottom: 8px;
  }

  .current-conditions-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-top: 8px;
  }

  .current-conditions-item {
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .popup-current-card .popup-card-inner {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.18);
    padding: 10px 12px;
  }

  .current-label {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 3px;
    color: #9fc1de;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .current-wind-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
  }

  .current-wind-item {
    position: relative;
  }

  /* "Tuuli"-otsikko piilotettu: nuolipallo (ks. alla) on niin iso ja
     lähellä yläreunaa, että pieni otsikkoteksti näytti irralliselta/
     hukkuvalta sen vierellä. Itse tuulilukemat (asteluku, nopeus)
     kertovat jo riittävästi mistä kortista on kyse. */
  .current-wind-item .current-label {
    display: none;
  }

  .current-wind-arrow-box {
    position: absolute;
    top: 8px;
    right: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: #dbeeff;
    border: 1px solid #a9d4f0;
  }

  .current-wind-arrow {
    display: inline-flex;
    color: #bfe0ff;
    transition: color 0.2s ease;
  }

  .current-wind-dir {
    font-size: 24px;
    font-weight: 700;
    color: #eaf1f8;
  }

  /* Sama korosteväri JA fonttikoko kuin lämpötilalla
     (.popup-temp-value, 26px), koska tuulen nopeus on kortin toinen
     "pääluku" siinä missä suunta on toissijainen tieto. */
  .current-wind-speed {
    margin-top: 2px;
    font-size: 26px;
    font-weight: 700;
    color: #ffab91;
  }

  .popup-current-card .popup-temp-value {
    font-size: 26px;
    color: #ffab91;
  }

  .current-temp-sun-card,
  .current-sealevel-wave-card {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .current-temp-sun-card > div:not(:first-child),
  .current-sealevel-wave-card > div:not(:first-child) {
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.15);
  }

  .popup-current-card .wind-flow-sealevel-row {
    min-width: 0;
  }

  .popup-current-card .wind-flow-sealevel-label {
    color: #9fc1de;
  }

  .popup-current-card .wind-flow-sealevel-value {
    color: #bfe0ff;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .popup-current-card .popup-wave-height-value {
    color: #bfe0ff;
  }

  .popup-current-card .popup-wave-period-label {
    color: #9fc1de;
  }

  .popup-current-card .popup-wave-period-value {
    color: #eaf1f8;
  }

  .popup-current-card .popup-wave-info-text {
    color: #cfe0f0;
  }

  .popup-current-card .popup-inline-item:not(:first-child)::before {
    border-left-color: rgba(255,255,255,0.25);
  }

  .current-sunrise-value,
  .current-sunset-value {
    color: #eaf1f8;
    font-weight: 600;
  }

  .popup-current-card .popup-hourly-day {
    color: #9fc1de;
  }

  .popup-current-card .popup-hourly-hour {
    color: #cfe0f0;
  }

  .popup-current-card .popup-hourly-temp {
    color: #ffab91;
  }

  .popup-card {
    background: #e8eef5;
    border: 1px solid #c5d5e3;
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    box-sizing: border-box;
  }

  .popup-card-inner {
    background: #e8eef5;
    border: 1px solid #c5d5e3;
    border-radius: 8px;
    padding: 6px 8px;
    box-sizing: border-box;
  }

  /* Lämpötila/Vedenkorkeus/Aallokko/Sää-kortit ovat nyt itsenäisiä,
     pinottuja "top-level"-kortteja (eivät enää sivupalkin sisällä),
     joten niille annetaan samat mitat kuin .popup-card:lle. */
  .mobile-stack-card {
    border-radius: 12px;
    padding: 10px 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .popup-note {
    background: #fff8e1;
    border: 1px solid #f0dfa0;
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.4;
    color: #6b5900;
    margin-bottom: 12px;
    box-sizing: border-box;
  }

  /* Graafin kääre: kiinteä korkeus, ei riipu sisällöstä (estää
     Chart.js:n responsive-mittauksen ruokkimasta itseään), leveys
     100 % kortin leveydestä. Sama malli kuin desktopin
     index.html:ssä. */
  .popup-chart-wrapper {
    width: 100%;
    height: 160px;
  }

  .popup-chart {
    width: 100% !important;
    max-width: 100%;
    height: 100% !important;
  }

  .popup-extras {
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 13px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }

  .popup-pressure {
    font-size: 0.9rem;
    color: #222;
    white-space: nowrap;
  }

  .popup-pressure--na {
    opacity: 0.6;
    font-style: italic;
  }

  .wind-flow-sealevel-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    line-height: 1.3;
  }

  .wind-flow-sealevel-label {
    font-size: 16px;
    color: #888;
    min-width: 72px;
    white-space: nowrap;
  }

  .wind-flow-sealevel-value {
    font-size: 16px;
    font-weight: 700;
    color: #1a4d7a;
    white-space: nowrap;
  }

  .popup-icon {
    width: 18px;
    height: 18px;
    display: block;
  }

  .popup-inline-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .popup-inline-item:not(:first-child)::before {
    content: "";
    border-left: 1px solid rgba(0,0,0,0.25);
    height: 14px;
    margin: 0 8px;
  }

  .popup-temp-value {
    font-size: 22px;
    font-weight: 700;
    color: #c62828;
    line-height: 1.1;
  }

  .popup-sun-row {
    display: flex;
    gap: 18px;
    margin-top: 4px;
    font-size: 14px;
  }

  .popup-hourly-day {
    margin-top: 8px;
    font-size: 10px;
    font-weight: 600;
    color: #666;
  }

  .popup-hourly-forecast {
    display: flex;
    gap: 2px;
    margin-top: 3px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .popup-hourly-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 0 0 auto;
    width: 30px;
    gap: 2px;
  }

  .popup-hourly-hour {
    font-size: 10px;
    color: #555;
  }

  .popup-hourly-icon {
    width: 22px;
    height: 22px;
    display: block;
  }

  .popup-hourly-temp {
    font-size: 11px;
    font-weight: 700;
    color: #c62828;
  }

  /* Aallokko-otsikon vieressä oleva info-nappi + selitysteksti (miksi
     lukema on tarkalleen havaintoaseman, ei avomeren, kohdalla – ks.
     renderWaveCard, js/popup/popupExtras.js). Isompi kosketuskohde
     kuin desktopilla (index.html), koska mobiilissa napautetaan
     sormella eikä hiirellä. */
  .popup-wave-label-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .popup-info-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid currentColor;
    background: transparent;
    color: inherit;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    padding: 0;
    cursor: pointer;
  }

  .popup-wave-info-text {
    font-size: 14px;
    color: #555;
    line-height: 1.4;
    margin: 2px 0 6px;
  }

  .popup-wave-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-top: 2px;
  }

  .popup-wave-height-value {
    font-size: 16px;
    font-weight: 700;
    color: #1a4d7a;
  }

  .popup-wave-period-label {
    font-size: 16px;
    color: #888;
  }

  .popup-wave-period-value {
    font-size: 16px;
    font-weight: 600;
    color: #444;
  }

  .wind-flow-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    width: 100%;
    margin-top: 6px;
  }

  .wind-flow-btn {
    padding: 6px 10px;
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
    text-align: center;
    border: 1px solid #999;
    border-radius: 4px;
    background: #fff;
    color: #333;
    cursor: pointer;
  }

  .wind-flow-btn.active {
    background: #222;
    color: #fff;
    border-color: #222;
  }

  .wind-flow-ticks span {
    font-size: 10px;
    color: #888;
  }

  /* ==========================
     Mobiilin oma asemakortti (js/popup/mobileStationDetail.js)
     – pinotut kortit, ei desktopin sivupalkkilayoutia, ei
     kiinteitä pikselileveyksiä tai attribuuttivalitsimia.
     ========================== */

  .mobile-stack-card {
    margin-bottom: 10px;
  }

  .mobile-card-label {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 2px;
    color: #444;
  }

  /* Tuuliennusteanimaatio: neliömäinen kanvaasi, sen alla
     liukusäädin ja tuntinapit peräkkäisinä lohkoina – ei enää
     riippuvainen ympäröivän flex-rivin absoluuttisesti
     sijoitetuista lapsista. */

  .wind-flow-title-row {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }

  .wind-flow-title-row .wind-flow-speed-label {
    font-size: 16px;
    font-weight: bold;
    color: #444;
  }

  .wind-flow-wrapper {
    position: relative;
    width: 100%;
    max-width: 320px;
    aspect-ratio: 1 / 1;
    margin: 0 auto;
  }

  .wind-flow-bg,
  .wind-flow-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  .wind-flow-slider-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    width: 100%;
    max-width: 320px;
    margin-left: auto;
    margin-right: auto;
  }

  .wind-flow-slider-row .wind-flow-slider {
    flex: 1;
  }

  .wind-flow-slider-row .wind-flow-time-label {
    font-size: 12px;
    color: #444;
    min-width: 78px;
    text-align: right;
  }

  .wind-flow-ticks-row {
    width: 100%;
    max-width: 320px;
    margin: 0 auto;
  }

  .wind-flow-ticks {
    display: flex;
    justify-content: space-between;
  }

  /* Tuulen tekstimuotoinen aikajana */

  .wind-timeline-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .wind-charts-toggle {
    font-size: 12px;
    color: #1a4d7a;
    text-decoration: none;
  }

  .wind-charts-toggle:hover {
    text-decoration: underline;
  }

  .wind-charts-panel {
    margin-bottom: 10px;
  }

  .wind-timeline-list {
    max-height: 260px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    border-top: 1px solid #eee;
  }

  .wind-timeline-day {
    position: sticky;
    top: 0;
    background: #f2f3f5;
    font-size: 14px;
    font-weight: 700;
    color: #666;
    padding: 6px 2px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .wind-timeline-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 2px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 16px;
  }

  .wind-timeline-row-now {
    background: #cfe3fa;
    border-radius: 6px;
    border-left: 4px solid #1a4d7a;
    padding-left: 8px;
    margin: 2px 0;
    font-weight: 700;
    color: #0f3559;
  }

  .wind-timeline-row-now .wind-timeline-time,
  .wind-timeline-row-now .wind-timeline-speed,
  .wind-timeline-row-now .wind-timeline-gust {
    color: #0f3559;
  }

  .wind-timeline-row-now .wind-timeline-arrow {
    color: #0f3559;
  }

  .wind-timeline-time {
    min-width: 54px;
    color: #444;
  }

  .wind-timeline-arrow {
    display: inline-block;
    width: 20px;
    text-align: center;
    color: #1a4d7a;

  /* Nopeus ja puuska omina kiinteälevyisinä sarakkeinaan, jotta

  .wind-timeline-speed {
    min-width: 62px;
    color: #222;
  }

  .wind-timeline-gust {

  }

  .wind-timeline-empty {

    color: #888;
