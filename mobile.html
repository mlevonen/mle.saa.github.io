<!DOCTYPE html>
<html lang="fi">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FMI Havaintopisteet</title>
<link rel="icon" href="data:,">

<style>

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #f2f3f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #222;
  }

  /* ==========================
     Yläpalkki
     ========================== */

  .app-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #1a4d7a;
    color: #fff;
    padding: 14px 16px calc(14px + env(safe-area-inset-top, 0px));
    padding-top: max(14px, env(safe-area-inset-top, 0px));
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  .app-header h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
  }

  .app-header a {
    color: #cfe4f7;
    font-size: 12px;
    text-decoration: none;
  }

  .app-header a:hover {
    text-decoration: underline;
  }

  /* ==========================
     Merialuelistaus
     ========================== */

  .station-list-wrapper {
    padding: 8px 0 24px;
  }

  .sea-area-section {
    margin-bottom: 4px;
  }

  .sea-area-title {
    position: sticky;
    top: 52px;
    margin: 0;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #555;
    background: #e8eaee;
    border-bottom: 1px solid #dcdfe4;
  }

  .station-list {
    list-style: none;
    margin: 0;
    padding: 0;
    background: #fff;
  }

  .station-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    min-height: 50px;
    padding: 12px 16px;
    border: none;
    border-bottom: 1px solid #eee;
    background: #fff;
    font-size: 15px;
    color: #222;
    text-align: left;
    cursor: pointer;
    -webkit-tap-highlight-color: rgba(0,0,0,0.06);
  }

  .station-item:active {
    background: #f0f2f5;
  }

  .station-item-name {
    flex: 1;
  }

  .station-item-preview {
    font-size: 12px;
    color: #777;
    margin-right: 8px;
    white-space: nowrap;
  }

  .station-item-chevron {
    color: #aaa;
    font-size: 18px;
    line-height: 1;
  }

  .empty-note {
    padding: 40px 20px;
    text-align: center;
    color: #888;
    font-size: 14px;
  }

  /* ==========================
     Asemakortin "bottom sheet"
     ========================== */

  .detail-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }

  .detail-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .detail-sheet {
    position: relative;
    width: 100%;
    max-width: 560px;
    max-height: 92vh;
    background: #f2f3f5;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.25);
    overflow-y: auto;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    transform: translateY(100%);
    transition: transform 0.25s ease;
  }

  .detail-overlay.open .detail-sheet {
    transform: translateY(0);
  }

  .detail-close {
    position: sticky;
    top: 0;
    float: right;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.08);
    color: #333;
    font-size: 16px;
    line-height: 32px;
    text-align: center;
    padding: 0;
    cursor: pointer;
    z-index: 2;
  }

  .detail-close:hover {
    background: rgba(0,0,0,0.14);
  }

  /* ==========================
     Asemakortin sisältö (jaettu desktop-popupin kanssa,
     ks. js/popup/stationDetail.js)
     ========================== */

  .popup-title {
    font-weight: bold;
    font-size: 17px;
    margin-bottom: 6px;
    padding-right: 40px;
  }

  .popup-card {
    background: #fff;
    border: 1px solid #e3e3e3;
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    box-sizing: border-box;
  }

  .popup-card-inner {
    background: #fafafa;
    border: 1px solid #e8e8e8;
    border-radius: 8px;
    padding: 6px 8px;
    box-sizing: border-box;
  }

  .popup-note {
    background: #fff8e1;
    border: 1px solid #f0dfa0;
    border-radius: 10px;
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.4;
    color: #6b5900;
    margin-bottom: 12px;
    box-sizing: border-box;
  }

  .popup-chart {
    width: 100% !important;
    max-width: 100%;
    height: 160px !important;
  }

  .popup-extras {
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 13px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }

  .popup-pressure {
    font-size: 0.9rem;
    color: #222;
    white-space: nowrap;
  }

  .popup-pressure--na {
    opacity: 0.6;
    font-style: italic;
  }

  .wind-flow-sealevel-row {
    display: flex;
    align-items: baseline;
    gap: 6px;
    line-height: 1.3;
  }

  .wind-flow-sealevel-label {
    font-size: 10px;
    color: #888;
    min-width: 52px;
    white-space: nowrap;
  }

  .wind-flow-sealevel-value {
    font-size: 14px;
    font-weight: 700;
    color: #1a4d7a;
    white-space: nowrap;
  }

  .popup-icon {
    width: 18px;
    height: 18px;
    display: block;
  }

  .popup-inline-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .popup-inline-item:not(:first-child)::before {
    content: "";
    border-left: 1px solid rgba(0,0,0,0.25);
    height: 14px;
    margin: 0 8px;
  }

  .popup-temp-value {
    font-size: 22px;
    font-weight: 700;
    color: #c62828;
    line-height: 1.1;
  }

  .popup-sun-row {
    display: flex;
    gap: 18px;
    margin-top: 4px;
    font-size: 14px;
  }

  .popup-hourly-day {
    margin-top: 8px;
    font-size: 10px;
    font-weight: 600;
    color: #666;
  }

  .popup-hourly-forecast {
    display: flex;
    gap: 2px;
    margin-top: 3px;
    overflow-x: auto;
    padding-bottom: 2px;
  }

  .popup-hourly-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 0 0 auto;
    width: 30px;
    gap: 2px;
  }

  .popup-hourly-hour {
    font-size: 10px;
    color: #555;
  }

  .popup-hourly-icon {
    width: 22px;
    height: 22px;
    display: block;
  }

  .popup-hourly-temp {
    font-size: 11px;
    font-weight: 700;
    color: #c62828;
  }

  .popup-wave-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-top: 2px;
  }

  .popup-wave-height-value {
    font-size: 14px;
    font-weight: 700;
    color: #1a4d7a;
  }

  .popup-wave-period-label {
    font-size: 11px;
    color: #888;
  }

  .popup-wave-period-value {
    font-weight: 600;
    color: #444;
  }

  .wind-flow-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    width: 100%;
    margin-top: 6px;
  }

  .wind-flow-btn {
    padding: 5px 8px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    text-align: center;
    border: 1px solid #999;
    border-radius: 4px;
    background: #fff;
    color: #333;
    cursor: pointer;
  }

  .wind-flow-btn.active {
    background: #222;
    color: #fff;
    border-color: #222;
  }

  .wind-flow-ticks span {
    font-size: 10px;
    color: #888;
  }

  /* Jaetun asemakortin tuulivirtausanimaatio-osio on rakennettu
     kiinteillä pikselileveyksillä (320px kanvaasit, 345px sivupalkki)
     kapeaa desktop-popupia varten. Mobiilissa pinotaan kartta ja
     sivupalkki päällekkäin ja skaalataan täyteen leveyteen. */

  .popup-card > div[style*="align-items:flex-start"] {
    flex-direction: column !important;
  }

  .wind-flow-wrapper {
    width: 100% !important;
    max-width: 320px;
    height: auto !important;
    aspect-ratio: 1 / 1;
    margin: 0 auto;
  }

  .wind-flow-bg,
  .wind-flow-canvas {
    width: 100% !important;
    height: 100% !important;
  }

  .wind-flow-sidebar {
    width: 100% !important;
  }

  .popup-card [style*="width:320px"] {
    width: 100% !important;
  }

</style>

</head>

<body>

  <header class="app-header">
    <h1>🌊 FMI Havaintopisteet</h1>
    <a href="index.html">Näytä kartalla ↗</a>
  </header>

  <main class="station-list-wrapper" id="station-list"></main>

  <div class="detail-overlay" id="detail-overlay">
    <div class="detail-sheet" id="detail-sheet">
      <button type="button" class="detail-close" id="detail-close" aria-label="Sulje">✕</button>
      <div id="detail-sheet-body"></div>
    </div>
  </div>

<!-- Chart.js UMD (tuuligraafit) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>

<!-- Omat tiedostot -->
<script src="js/stations.js"></script>
<script type="module" src="js/mobile.js"></script>

</body>
</html>
