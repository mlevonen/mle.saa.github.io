<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot ja ennuste</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body { margin: 0; height: 100%; }
#map { height: 100%; width: 100%; }
</style>
</head>
<body>

<div id="map"></div>

<script>
console.log("SCRIPT STARTED");

const map = L.map("map").setView([60, 25], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "© OpenStreetMap"
}).addTo(map);

let obsLayer = null;
let fcLayer  = null;

// ==========================
// Lämpötilan väri
// ==========================
function tempColor(t) {
  if (t == null || isNaN(t)) return "#999";
  if (t <= -20) return "#08306b";
  if (t <= -10) return "#2171b5";
  if (t <= 0)   return "#6baed6";
  if (t <= 10)  return "#fee08b";
  if (t <= 20)  return "#fdae61";
  return "#d73027";
}

// ==========================
// TUULINUOLI (SVG)
// ==========================
function windArrowMarker(latlng, speed, direction) {
  if (direction == null || isNaN(direction)) {
    return L.circleMarker(latlng, {
      radius: 4,
      color: "#333",
      fillOpacity: 0.6
    });
  }

  const size = Math.max(10, Math.min(30, speed * 2));

  const arrow = `
    <svg width="${size}" height="${size}" viewBox="0 0 100 100"
         style="transform: rotate(${direction}deg)">
      <polygon points="50,0 90,100 50,75 10,100"
               fill="#222"/>
    </svg>
  `;

  return L.marker(latlng, {
    icon: L.divIcon({
      html: arrow,
      className: "",
      iconSize: [size, size],
      iconAnchor: [size/2, size/2]
    })
  });
}

// =====================
// HAVAINNOT (TUULI)
// =====================
fetch("observations.json")
  .then(r => r.json())
  .then(data => {
    console.log("OBS FEATURES", data.features.length);

    obsLayer = L.layerGroup();

    data.features.forEach(f => {
      const [lon, lat] = f.geometry.coordinates;
      const p = f.properties;

      const marker = windArrowMarker(
        [lat, lon],
        p.ws,
        p.wd       // 🔥 TUULENSUUNTA ASTEINA
      );

      marker.bindPopup(`
        <strong>${p.station}</strong><br>
        🌡 ${p.t2m ?? "–"} °C<br>
        💨 ${p.ws ?? "–"} m/s<br>
        🧭 ${p.wd ?? "–"}°
      `);

      marker.addTo(obsLayer);
    });

    obsLayer.addTo(map);
    map.fitBounds(obsLayer.getBounds());
  })
  .catch(err => console.error("OBS FETCH ERROR", err));

// =====================
// ENNUSTE (PISTEET)
// =====================
fetch("forecast.json")
  .then(r => r.json())
  .then(fc => {
    console.log("FC FEATURES", fc.features.length);

    fcLayer = L.geoJSON(fc, {
      pointToLayer: (feature, latlng) =>
        L.circleMarker(latlng, {
          radius: 6,
          fillColor: tempColor(feature.properties.t2m),
          fillOpacity: 0.7,
          color: "#333",
          weight: 1
        }),

      onEachFeature: (feature, layer) => {
        const p = feature.properties;
        layer.bindPopup(`
          <strong>${p.city}</strong><br>
          🌡 ${p.t2m ?? "–"} °C<br>
          💨 ${p.ws ?? "–"} m/s
        `);
      }
    });

    fcLayer.addTo(map);

    // Layer switcher lisätään vasta kun molemmat on olemassa
    L.control.layers(null, {
      "Havainnot (tuuli)": obsLayer,
      "Ennuste (lämpötila)": fcLayer
    }).addTo(map);
  })
  .catch(err => console.error("FC FETCH ERROR", err));
</script>

</body>
</html>
