<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="icon" href="data:,">

<style>

html, body { margin: 0; height: 100%; }
#map { height: 100%; width: 100%; }

.leaflet-popup-content {
  width: auto !important;
}

.leaflet-popup-content-wrapper {
  max-width: 760px;
}

.popup-title {
  font-weight: bold;
  margin-bottom: 6px;
}

.popup-chart {
  width: 560px;   /* +40 % */
  height: 200px;
}

.popup-extras {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.weather-icon {
  width: 36px;
  height: 36px;
}

.popup-pressure {
  font-size: 0.9rem;
  color: #222;
  white-space: nowrap;
}

.popup-extras {
  display: flex;
  gap: 10px;
  font-size: 13px;
  margin-bottom: 6px;
}

.popup-sealevel {
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.popup-sealevel-icon {
  width: 18px;
  height: 18px;
}

.popup-pressure {
  white-space: nowrap;
}

.popup-pressure--na {
  opacity: 0.6;
  font-style: italic;
}

.popup-weather-symbol {
  display: flex;
  justify-content: center;
  margin: 4px 0 8px;
}

.popup-weather-icon {
  width: 32px;
  height: 32px;
  margin-right: 8px;
}


.popup-metrics {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 6px;
}

.popup-row {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.popup-icon {
  width: 18px;
  height: 18px;
  display: block;
}

.popup-row {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.popup-inline-metrics {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
}

.popup-inline-item {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* Automaattinen pystyerotin */
.popup-inline-item:not(:first-child)::before {
  content: "";
  border-left: 1px solid rgba(0,0,0,0.25);
  height: 14px;
  margin: 0 8px;
}

.wind-wrapper {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 12px;
  color: #111;
}

.wind-wrapper svg {
  display: block;
}

.wind-speed {
  margin-top: -4px;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

.dot-weather {
  background: #007bff;
}

.dot-coastal {
  background: #00aa66;
}

.dot-sealevel {
  background: #aa0000;
}

.wind-wrapper {
  background: transparent;
  border: none;
}

.wind-marker {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: 2px solid white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-family: sans-serif;
  color: white;
  font-weight: 600;
  box-shadow: 0 2px 6px rgba(0,0,0,0.35);
}

.wind-arrow {
  font-size: 18px;
  line-height: 16px;
  margin-bottom: 2px;
}

.wind-speed {
  font-size: 14px;
}

</style>

</head>

<body>
  <div id="map"></div>

<!-- Leaflet ENSIN -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Chart.js UMD -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>

<!-- Date adapter (bundle!) -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

<!-- Annotation plugin -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>

<!-- Omat tiedostot -->
<script src="js/stations.js"></script>
<script type="module" src="js/main.js"></script>

</body>
</html>
