<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot ja ennuste</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>

<style>
html, body { margin: 0; height: 100%; }
#map { height: 100%; width: 100%; }

.leaflet-popup-content { width: 420px !important; }

.popup-title { font-weight: bold; margin-bottom: 6px; }

.popup-chart { width: 400px; height: 160px; }

.wind-arrow {
  font-size: 18px;
  color: #333;
  pointer-events: none;
}
</style>
</head>

<body>
<div id="map"></div>

<script>
"use strict";

/* ==========================
   Kartta
========================== */
const map = L.map("map").setView([60, 25], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

/* ==========================
   Tuulinuolet kartalle
========================== */
const windArrowLayer = L.layerGroup().addTo(map);

function addOrUpdateWindArrow(lat, lon, windDirDeg) {
  const key = `${lat},${lon}`;

  windArrowLayer.eachLayer(l => {
    if (l.options._key === key) windArrowLayer.removeLayer(l);
  });

  const icon = L.divIcon({
    className: "wind-arrow",
    html: "➤",
    iconSize: [20, 20],
    iconAnchor: [10, 10]
  });

  const marker = L.marker([lat, lon], { icon });
  marker.options._key = key;
  marker.getElement()?.style.setProperty(
    "transform",
    `rotate(${windDirDeg + 180}deg)`
  );

  marker.addTo(windArrowLayer);
}

/* ==========================
   FMI API
========================== */
async function fetchTimeSeriesREST(lat, lon, param) {
  const now = new Date();
  const past = new Date(now.getTime() - 6 * 3600_000).toISOString();

  const url = `https://opendata.fmi.fi/timeseries?latlon=${lat},${lon}&starttime=${past}&endtime=${now.toISOString()}&param=${param}&format=json`;
  return fetch(url).then(r => r.json());
}

async function fetchForecastREST(lat, lon, param) {
  const now = new Date();
  const future = new Date(now.getTime() + 12 * 3600_000).toISOString();

  const url = `https://opendata.fmi.fi/timeseries?latlon=${lat},${lon}&starttime=${now.toISOString()}&endtime=${future}&param=${param}&source=forecast&format=json`;
  return fetch(url).then(r => r.json());
}

/* ==========================
   Popup cache
========================== */
const popupCache = {};

/* ==========================
   Asemat kartalle
========================== */
fetch("stations.json")
  .then(r => r.json())
  .then(data => {
    const layer = L.featureGroup().addTo(map);

    data.features.forEach(f => {
      const [lon, lat] = f.geometry.coordinates;
      const { name } = f.properties;

      const marker = L.circleMarker([lat, lon], {
        radius: 5,
        color: "blue",
        fillOpacity: 0.7
      }).addTo(layer);

      marker.bindPopup(`
        <div class="popup-title">${name}</div>

        <div><strong>Lämpötila</strong></div>
        <canvas class="popup-chart" data-type="temp" data-lat="${lat}" data-lon="${lon}"></canvas>

        <div style="margin-top:6px;"><strong>Tuuli</strong></div>
        <canvas class="popup-chart" data-type="wind" data-lat="${lat}" data-lon="${lon}"></canvas>
      `);


//POPUP AVATAAN

      marker.on("popupopen", async e => {
        const popupEl = e.popup.getElement();
        const canvases = popupEl.querySelectorAll("canvas");
        const lat = canvases[0].dataset.lat;
        const lon = canvases[0].dataset.lon;
        const key = `${lat},${lon}`;

        let obsTemp, fcTemp, obsWind, fcWind, fcDir;

        if (popupCache[key]) {
          console.log("CACHE HIT:", key);
          ({ obsTemp, fcTemp, obsWind, fcWind, fcDir } = popupCache[key]);
        } else {
          console.log("CACHE MISS:", key);
          obsTemp = await fetchTimeSeriesREST(lat, lon, "temperature");
          fcTemp  = await fetchForecastREST(lat, lon, "temperature");
          obsWind = await fetchTimeSeriesREST(lat, lon, "windspeedms");
          fcWind  = await fetchForecastREST(lat, lon, "windspeedms");
          fcDir   = await fetchForecastREST(lat, lon, "winddirection");

          popupCache[key] = { obsTemp, fcTemp, obsWind, fcWind, fcDir };
        }

/* --- Lämpötila --- */
const tempCanvas = popupEl.querySelector('canvas[data-type="temp"]');

const oldTempChart = Chart.getChart(tempCanvas);
if (oldTempChart) oldTempChart.destroy();

const obsTempValues = obsTemp.map(p => p.temperature);
const fcTempValues  = fcTemp.map(p => p.temperature);

new Chart(tempCanvas, {
  type: "line",
  data: {
    labels: [
      ...obsTempValues.map((_, i) => i),
      ...fcTempValues.map((_, i) => i + obsTempValues.length)
    ],
    datasets: [
      {
        label: "Havainto",
        data: [...obsTempValues, ...Array(fcTempValues.length).fill(null)],
        borderColor: "blue",
        tension: 0.3
      },
      {
        label: "Ennuste",
        data: [...Array(obsTempValues.length).fill(null), ...fcTempValues],
        borderColor: "red",
        borderDash: [6, 4],
        tension: 0.3
      }
    ]
  },
  options: {
    responsive: false,
    plugins: {
      legend: { display: false }
    },
    scales: {
      y: {
        title: { display: true, text: "°C" }
      }
    }
  }
});

/* --- Tuuli --- */
const windCanvas = popupEl.querySelector('canvas[data-type="wind"]');

const oldWindChart = Chart.getChart(windCanvas);
if (oldWindChart) oldWindChart.destroy();

const obsWindValues = obsWind.map(p => p.windspeedms);
const fcWindValues  = fcWind.map(p => p.windspeedms);

new Chart(windCanvas, {
  type: "line",
  data: {
    labels: [
      ...obsWindValues.map((_, i) => i),
      ...fcWindValues.map((_, i) => i + obsWindValues.length)
    ],
    datasets: [
      {
        label: "Havainto",
        data: [...obsWindValues, ...Array(fcWindValues.length).fill(null)],
        borderColor: "green",
        tension: 0.3
      },
      {
        label: "Ennuste",
        data: [...Array(obsWindValues.length).fill(null), ...fcWindValues],
        borderColor: "red",
        borderDash: [6, 4],
        tension: 0.3
      }
    ]
  },
  options: {
    responsive: false,
    plugins: {
      legend: { display: false }
    },
    scales: {
      y: {
        title: { display: true, text: "m/s" }
      }
    }
  }
});
});

    map.fitBounds(layer.getBounds(), { padding: [30, 30] });
  });
</script>
</body>
</html>
