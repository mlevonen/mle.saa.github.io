<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body { margin: 0; height: 100%; }
#map { height: 100%; width: 100%; }

.popup-title {
  font-weight: bold;
  margin-bottom: 6px;
}
</style>
</head>
<body>

<div id="map"></div>

<script>
// ==========================
// Kartta
// ==========================
const map = L.map("map").setView([60, 25], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

// ==========================
// Lämpötilavärit
// ==========================
function tempColor(t) {
  if (t == null || isNaN(t)) return "#999";
  if (t <= -20) return "#08306b";
  if (t <= -10) return "#2171b5";
  if (t <= 0)   return "#6baed6";
  if (t <= 10)  return "#fee08b";
  if (t <= 20)  return "#fdae61";
  return "#d73027";
}

// ==========================
// Tuulinuoli
// ==========================
function windArrowIcon(dir, color) {
  const rot = (dir ?? 0) - 180;
  return L.divIcon({
    className: "",
    iconSize: [24, 24],
    html: `
      <svg width="24" height="24" viewBox="0 0 100 100"
           style="transform: rotate(${rot}deg)">
        <polygon points="50,0 90,100 50,75 10,100"
                 fill="${color}" />
      </svg>
    `
  });
}

// ==========================
// YKSINKERTAINEN lämpötilagraafi
// ==========================
function temperatureChart(values) {
  if (values.length < 2) return "<em>Ei graafia</em>";

  const w = 160, h = 50;
  const min = Math.min(...values);
  const max = Math.max(...values);
  const r = max - min || 1;

  let d = "";
  values.forEach((v, i) => {
    const x = (i / (values.length - 1)) * w;
    const y = h - ((v - min) / r) * h;
    d += (i === 0 ? "M" : "L") + x + "," + y;
  });

  return `
    <svg width="${w}" height="${h}">
      <path d="${d}" stroke="#d73027" stroke-width="2" fill="none"/>
    </svg>
  `;
}

// ==========================
// HAVAINNOT
// ==========================
fetch("observations.json")
  .then(r => r.json())
  .then(data => {

    console.log("OBS FEATURES", data.features.length);

    // ryhmittely ASEMITTAIN
    const byStation = {};

    data.features.forEach(f => {
      const p = f.properties;
      if (!byStation[p.station]) {
        byStation[p.station] = {
          coords: f.geometry.coordinates,
          temps: [],
          first: p
        };
      }
      if (p.t2m !== null && !isNaN(p.t2m)) {
        byStation[p.station].temps.push(p.t2m);
      }
    });

    const layer = L.layerGroup().addTo(map);

    Object.entries(byStation).forEach(([station, s]) => {
      const [lon, lat] = s.coords;

      const marker = L.marker([lat, lon], {
        icon: windArrowIcon(s.first.wd, tempColor(s.first.t2m))
      });

      marker.bindPopup(`
        <div class="popup-title">${station}</div>
        🌡 ${s.first.t2m ?? "–"} °C<br>
        💨 ${s.first.ws ?? "–"} m/s<br><br>
        ${temperatureChart(s.temps)}
      `);

      marker.addTo(layer);
    });

    if (layer.getLayers().length > 0) {
      map.fitBounds(layer.getBounds(), { padding: [30, 30] });
    }
  })
  .catch(err => console.error("OBS FETCH ERROR", err));
</script>

</body>
</html>
