<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
html, body { margin: 0; height: 100%; }
#map { height: 100%; width: 100%; }

.leaflet-popup-content {
  width: 420px !important;
}

.popup-title {
  font-weight: bold;
  margin-bottom: 6px;
}

.popup-chart {
  width: 400px;
  height: 200px;
}
</style>
</head>

<body>
<div id="map"></div>

<script>
const map = L.map("map").setView([60, 25], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

const FMI_WFS = "https://opendata.fmi.fi/wfs";

// ==========================
// Asemat kartalle
// ==========================
fetch("stations.json")
  .then(r => r.json())
  .then(data => {

    const layer = L.featureGroup().addTo(map);

    data.features.forEach(f => {
      const [lon, lat] = f.geometry.coordinates;
      const { name } = f.properties;

      const marker = L.circleMarker([lat, lon], {
        radius: 5,
        color: "blue",
        fillOpacity: 0.7
      }).addTo(layer);

      marker.bindPopup(`
        <div class="popup-title">${name}</div>
        <canvas
          class="popup-chart"
          width="400"
          height="200"
          data-lat="${lat}"
          data-lon="${lon}"
        ></canvas>
      `);
    });

    map.fitBounds(layer.getBounds(), { padding: [30, 30] });
  });

// ==========================
// FMI aikasarja (JSON TUETTU)
// ==========================
async function fetchTimeSeries(lat, lon, parameter) {
  const now = new Date();

  const start = new Date(now.getTime() - 6 * 3600_000).toISOString();
  const end   = now.toISOString(); // EI tulevaisuutta!

  const params = new URLSearchParams({
    service: "WFS",
    version: "2.0.0",
    request: "GetFeature",
    storedquery_id: "fmi::observations::weather::timevaluepair",
    latlon: `${Number(lat)},${Number(lon)}`,
    parameters: parameter,
    starttime: start,
    endtime: end,
    timestep: "60",
    outputFormat: "application/json"
  });

  const url = `${FMI_WFS}?${params}`;
  console.log("FMI REQUEST:", url);

  const res = await fetch(url);
  const text = await res.text();

  if (!res.ok || text.startsWith("<")) {
    console.error("FMI RAW RESPONSE:", text);
    return null;
  }

  return JSON.parse(text);
}


// ==========================
// Popup → graafi + tuulinuoli
// ==========================
map.on("popupopen", async e => {
  const canvas = e.popup.getElement().querySelector("canvas");
  if (!canvas) return;

  const lat = canvas.dataset.lat;
  const lon = canvas.dataset.lon;

  const tempData = await fetchTimeSeries(lat, lon, "temperature");
  const windData = await fetchTimeSeries(lat, lon, "winddirection");

  if (!tempData || tempData.features.length === 0) {
    canvas.replaceWith("Ei havaintodataa saatavilla");
    return;
  }

  const temps = tempData.features.map(f => ({
    t: new Date(f.properties.time),
    v: f.properties.temperature
  }));

  const latestWind =
    windData?.features.at(-1)?.properties.winddirection ?? null;

  if (latestWind !== null) {
    e.popup.getElement()
      .querySelector(".popup-title")
      .insertAdjacentHTML(
        "beforeend",
        ` <span style="display:inline-block;transform:rotate(${latestWind + 180}deg)">➤</span>`
      );
  }

  new Chart(canvas.getContext("2d"), {
    type: "line",
    data: {
      labels: temps.map(d =>
        d.t.toLocaleTimeString("fi-FI", { hour: "2-digit" })
      ),
      datasets: [{
        data: temps.map(d => d.v),
        borderColor: "blue",
        tension: 0.3
      }]
    },
    options: {
      responsive: false,
      plugins: { legend: { display: false } },
      scales: { y: { title: { display: true, text: "°C" } } }
    }
  });
});

  // Tuulinuoli otsikkoon
  e.popup.getElement().querySelector(".popup-title").innerHTML +=
    ` <span style="display:inline-block;transform:rotate(${latestWind + 180}deg)">➤</span>`;

  new Chart(canvas.getContext("2d"), {
    type: "line",
    data: {
      labels: temps.map(d => d.t.toLocaleTimeString("fi-FI", { hour: "2-digit" })),
      datasets: [{
        data: temps.map(d => d.v),
        borderColor: "blue",
        tension: 0.3
      }]
    },
    options: {
      responsive: false,
      plugins: { legend: { display: false } },
      scales: { y: { title: { display: true, text: "°C" } } }
    }
  });
});
</script>

</body>
</html>
