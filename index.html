<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="icon" href="data:,">

<style>

html, body { margin: 0; height: 100%; }
#map { height: 100%; width: 100%; }

.leaflet-popup-content {
  width: auto !important;
}

.leaflet-popup-content-wrapper {
  max-width: 760px;
}

.popup-title {
  font-weight: bold;
  margin-bottom: 6px;
}

.popup-chart {
  width: 560px;   /* +40 % */
  height: 200px;
}

.popup-extras {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.weather-icon {
  width: 36px;
  height: 36px;
}

.popup-pressure {
  font-size: 0.9rem;
  color: #222;
  white-space: nowrap;
}

.popup-extras {
  display: flex;
  gap: 10px;
  font-size: 13px;
  margin-bottom: 6px;
}

.popup-sealevel {
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.popup-sealevel-icon {
  width: 18px;
  height: 18px;
}

.sealevel-marker {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: rgba(210,210,210,0.92);

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  border: 2px solid #3a3a3a;
  box-shadow: 0 3px 8px rgba(0,0,0,0.35);

  font-family: sans-serif;
}

.sealevel-arrow {
  font-size: 18px;
  font-weight: 900;
  line-height: 14px;
}

.sealevel-value {
  font-size: 13px;
  font-weight: 700;
  color: #222;
  line-height: 14px;
}


.popup-pressure {
  white-space: nowrap;
}

.popup-pressure--na {
  opacity: 0.6;
  font-style: italic;
}

.popup-weather-symbol {
  display: flex;
  justify-content: center;
  margin: 4px 0 8px;
}

.popup-weather-icon {
  width: 32px;
  height: 32px;
  margin-right: 8px;
}


.popup-metrics {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 6px;
}

.popup-row {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.popup-icon {
  width: 18px;
  height: 18px;
  display: block;
}

.popup-row {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.popup-inline-metrics {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
}

.popup-inline-item {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* Automaattinen pystyerotin */
.popup-inline-item:not(:first-child)::before {
  content: "";
  border-left: 1px solid rgba(0,0,0,0.25);
  height: 14px;
  margin: 0 8px;
}



.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

.dot-weather {
  background: #007bff;
}

.dot-coastal {
  background: #00aa66;
}

.dot-sealevel {
  background: #aa0000;
}

.wind-marker-wrapper {
  background: transparent;
  border: none;
}

.wind-marker {
  position: relative;
  width: 44px;
  height: 44px;
}

/* Sääikoni – piilossa oletuksena, näkyy kun "Sääsymbolit"-valinta on päällä */
.weather-icon-wrapper {
  position: absolute;
  top: -5px;
  left: -6px;
  width: 24px;
  height: 24px;
  z-index: 1;   /* alle */
  display: none;
}

.show-weather-symbols .weather-icon-wrapper {
  display: block;
}

/* tausta */
.weather-icon-wrapper::before {
  content: "";
  position: absolute;
  inset: -3px;

  background: transparent;
  border-radius: 50%;
  z-index: 1;
}

/* itse ikoni */
.marker-weather-icon {
  position: relative;
  width: 150%;
  height: 150%;
  z-index: 2;
}

/* Nuoli */
.marker-arrow {
  position: absolute;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  transform: translate(8px, 8px);
  z-index: 3;   /* päälle */
}

/* Nopeus */
.marker-speed {
  position: absolute;
  bottom: 1px;
  right: 2px;
  font-size: 13px;
  font-weight: 700;
  color: #524f4f;
  text-shadow: 0 0 1px rgba(0,0,0,0.9);
}

.yr-popup img {
  width: 100%;
  height: auto;
  display: block;
}
</style>

</head>

<body>
  <div id="map"></div>

<!-- Leaflet ENSIN -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Chart.js UMD -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>

<!-- Date adapter (bundle!) -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

<!-- Annotation plugin -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>

<!-- Omat tiedostot -->
<script src="js/stations.js"></script>
<script type="module" src="js/main.js"></script>

</body>
</html>
