<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FMI Sääkartta – Ennuste</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body { margin: 0; height: 100%; }
#map { height: 100%; width: 100%; }

.popup-table {
  font-size: 12px;
  border-collapse: collapse;
}
.popup-table td {
  padding: 2px 6px;
  white-space: nowrap;
}
.popup-table tr:nth-child(even) {
  background: #f2f2f2;
}
</style>
</head>
<body>

<div id="map"></div>

<script>
console.log("SCRIPT STARTED");

// ==========================
// Kartta
// ==========================
const map = L.map("map").setView([60, 25], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

// ==========================
// Lämpötilavärit
// ==========================
function tempColor(t) {
  if (t == null || isNaN(t)) return "#999";
  if (t <= -20) return "#08306b";
  if (t <= -10) return "#2171b5";
  if (t <= 0)   return "#6baed6";
  if (t <= 10)  return "#fee08b";
  if (t <= 20)  return "#fdae61";
  return "#d73027";
}

// ==========================
// Tuulinuoli (SVG)
// ==========================
function windArrowIcon(dir, color) {
  const rot = (dir ?? 0) - 180;
  return L.divIcon({
    className: "",
    iconSize: [26, 26],
    html: `
      <svg width="26" height="26" viewBox="0 0 100 100"
           style="transform: rotate(${rot}deg)">
        <polygon points="50,0 90,100 50,75 10,100"
                 fill="${color}" />
      </svg>
    `
  });
}

// ==========================
// Ennusteiden haku
// ==========================
fetch("forecast.json")
  .then(r => r.json())
  .then(data => {

    console.log("FC FEATURES", data.features.length);

    // ==========================
    // Ryhmitellään kaupungeittain
    // ==========================
    const byCity = {};

    data.features.forEach(f => {
      const p = f.properties;
      if (!byCity[p.city]) {
        byCity[p.city] = {
          coords: f.geometry.coordinates,
          rows: []
        };
      }
      byCity[p.city].rows.push(p);
    });

    const layer = L.layerGroup().addTo(map);

    // ==========================
    // Markerit + popupit
    // ==========================
    Object.entries(byCity).forEach(([city, data]) => {
      const [lon, lat] = data.coords;

      // järjestetään aika
      data.rows.sort((a, b) => a.time.localeCompare(b.time));

      const first = data.rows[0];

      const marker = L.marker([lat, lon], {
        icon: windArrowIcon(first.wd, tempColor(first.t2m))
      });

      // popup-taulukko
      let html = `<strong>${city}</strong><br><br>`;
      html += `<table class="popup-table">`;

      data.rows.forEach(r => {
        const t = new Date(r.time);
        const hh = t.getUTCHours().toString().padStart(2, "0");
        html += `
          <tr>
            <td>${t.toISOString().slice(0,10)} ${hh}:00</td>
            <td>🌡 ${r.t2m ?? "–"}°C</td>
            <td>💨 ${r.ws ?? "–"} m/s</td>
            <td>🧭 ${r.wd ?? "–"}°</td>
          </tr>
        `;
      });

      html += "</table>";

      marker.bindPopup(html);
      marker.addTo(layer);
    });

    map.fitBounds(layer.getBounds(), { padding: [30, 30] });
  })
  .catch(err => console.error("FORECAST FETCH ERROR", err));
</script>

</body>
</html>
