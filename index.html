<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;height:100%}
#map{height:100%;width:100%}
</style>
</head>
<body>

<div id="map"></div>

<script>
console.log("SCRIPT STARTED");

const map = L.map("map").setView([60, 25], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

// ==========================
// Värit lämpötilalle
// ==========================
function tempColor(t) {
  if (t == null || isNaN(t)) return "#999";
  if (t <= -20) return "#08306b";
  if (t <= -10) return "#2171b5";
  if (t <= 0)   return "#6baed6";
  if (t <= 10)  return "#fee08b";
  if (t <= 20)  return "#fdae61";
  return "#d73027";
}


let obsLayer;
let forecastLayer;

// =====================
// HAVAINNOT
// =====================
fetch("observations.json")
  .then(r => r.json())
  .then(data => {
    obsLayer = L.geoJSON(data, {
      onEachFeature: (feature, featureLayer) => {
        const p = feature.properties;
        featureLayer.bindPopup(`
          <strong>${p.station}</strong><br>
          🌡 ${p.t2m ?? "–"} °C<br>
          💨 ${p.ws ?? "–"} m/s
        `);
      }
    });

    obsLayer.addTo(map);
    map.fitBounds(obsLayer.getBounds());
  });

// =====================
// ENNUSTE
// =====================
fetch("forecast.json")
  .then(r => r.json())
  .then(data => {
    console.log("FC FEATURES", data.features.length);

    const forecastLayer = L.geoJSON(data, {
      pointToLayer: (feature, latlng) => {
        return L.circleMarker(latlng, {
          radius: 4,
          fillColor: "#2196f3",
          color: "#000",
          weight: 1,
          fillOpacity: 0.6
        });
      },
      onEachFeature: (feature, featureLayer) => {
        const p = feature.properties;
        featureLayer.bindPopup(`
          <strong>${p.city}</strong><br>
          🌡 ${p.t2m ?? "–"} °C<br>
          💨 ${p.ws ? p.ws.toFixed(1) : "–"} m/s
        `);
      }
    });

    forecastLayer.addTo(map);
  })
  .catch(err => console.error("FORECAST FETCH ERROR", err));



// ==========================
// Layer toggle
// ==========================
L.control.layers(null, {
  "Havainnot (tuuli)": obsLayer,
  "Ennuste (lämpötila)": fcLayer
}).addTo(map);
</script>



</body>
</html>
