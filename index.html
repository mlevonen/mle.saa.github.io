<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;height:100%}
#map{height:100%;width:100%}
</style>
</head>
<body>

<div id="map"></div>

<script>
console.log("SCRIPT STARTED");

const map = L.map("map").setView([60, 25], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

// ==========================
// Värit lämpötilalle
// ==========================
function tempColor(t) {
  if (t == null || isNaN(t)) return "#999";
  if (t <= -20) return "#08306b";
  if (t <= -10) return "#2171b5";
  if (t <= 0)   return "#6baed6";
  if (t <= 10)  return "#fee08b";
  if (t <= 20)  return "#fdae61";
  return "#d73027";
}

// ==========================
// HAVAINTOLAYER (nuolet)
// ==========================
const obsLayer = L.layerGroup().addTo(map);

fetch("observations.json")
  .then(r => r.json())
  .then(data => {
    console.log("OBS FEATURES", data.features.length);

    L.geoJSON(data, {
      pointToLayer: (feature, latlng) => {
        const p = feature.properties;
        const ws = p.ws ?? 0;

        return L.marker(latlng, {
          icon: L.divIcon({
            className: "wind-arrow",
            html: `
              <div style="
                transform: rotate(0deg);
                font-size: ${Math.max(14, ws * 2)}px;
                color: ${tempColor(p.t2m)};
              ">▲</div>
            `
          })
        });
      },

      onEachFeature: (feature, layer) => {
        const p = feature.properties;
        layer.bindPopup(`
          <strong>${p.station}</strong><br>
          🌡 ${p.t2m ?? "–"} °C<br>
          💨 ${p.ws ?? "–"} m/s
        `);
      }
    }).addTo(obsLayer);

    map.fitBounds(obsLayer.getBounds());
  });

// ==========================
// ENNUSTELAYER
// ==========================
const fcLayer = L.layerGroup();

fetch("forecast.json")
  .then(r => r.json())
  .then(data => {
    console.log("FC FEATURES", data.features.length);

    L.geoJSON(data, {
      pointToLayer: (feature, latlng) => {
        const t = feature.properties.t2m;
        return L.circleMarker(latlng, {
          radius: 3,
          fillColor: tempColor(t),
          fillOpacity: 0.4,
          color: "none"
        });
      }
    }).addTo(fcLayer);
  });

// ==========================
// Layer toggle
// ==========================
L.control.layers(null, {
  "Havainnot (tuuli)": obsLayer,
  "Ennuste (lämpötila)": fcLayer
}).addTo(map);
</script>



</body>
</html>
