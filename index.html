<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body { margin: 0; height: 100%; }
#map { height: 100%; width: 100%; }

.popup-title {
  font-weight: bold;
  margin-bottom: 6px;
}
</style>
<style>
.leaflet-popup-content {
  width: 420px !important;
}

.popup-chart {
  width: 400px;
  height: 200px;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>


</head>
<body>

<div id="map"></div>

<script>
console.log("SCRIPT START");

// ==========================
// Kartta
// ==========================
const map = L.map("map").setView([60, 25], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

// ==========================
// HAVAINNOT
// ==========================
fetch("observations.json")
  .then(r => r.json())
  .then(data => {

    console.log("OBS FEATURES", data.features.length);

    const byStation = {};

    data.features.forEach(f => {
      const p = f.properties;
      if (!byStation[p.station]) {
        byStation[p.station] = {
          coords: f.geometry.coordinates,
          rows: []
        };
      }
      byStation[p.station].rows.push(p);
    });

    const layer = L.featureGroup().addTo(map);

    Object.entries(byStation).forEach(([station, s]) => {
      const [lon, lat] = s.coords;

      s.rows.sort((a, b) => a.time.localeCompare(b.time));
      const latest = s.rows[s.rows.length - 1];

      const marker = L.marker([lat, lon], {
        icon: windArrowIcon(latest.wd, tempColor(latest.t2m))
      });

      const chartIdTemp = "temp_" + station.replace(/\W+/g, "_");
      const chartIdWind = "wind_" + station.replace(/\W+/g, "_");

      marker.bindPopup(`
        <div class="popup-title">${station}</div>
        <div>
          🌡 ${latest.t2m ?? "–"} °C &nbsp;
          💨 ${latest.ws ?? "–"} m/s
        </div>
        <canvas id="${chartIdTemp}" class="popup-chart"></canvas>
        <canvas id="${chartIdWind}" class="popup-chart"></canvas>
      `);

      marker.on("popupopen", () => {
        const rows = downsampleByMinutes(s.rows, 30);
        const nowTs = Date.now();

        const past = rows.filter(r => new Date(r.time).getTime() <= nowTs);
        const future = rows.filter(r => new Date(r.time).getTime() > nowTs);

        // 👉 TÄHÄN Chart.js -koodi (lämpö + tuuli)
      });

      marker.addTo(layer);
    });

    if (layer.getLayers().length > 0) {
      map.fitBounds(layer.getBounds(), { padding: [30,30] });
    }

  })
  .catch(err => console.error("OBS FETCH ERROR", err));

console.log("SCRIPT END");
</script>

</body>
</html>
