<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;height:100%}
#map{height:100%;width:100%}
</style>
</head>
<body>

<div id="map"></div>

<script>
console.log("SCRIPT STARTED");

// 1. Käytetään eri nimeä muuttujalle kuin div-elementin ID
const myMap = L.map("map").setView([60, 25], 6);
console.log("MAP CREATED", myMap);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; OpenStreetMap'
}).addTo(myMap);

fetch("observations.json")
  .then(r => r.json())
  .then(data => {
    console.log("GEOJSON LOADED", data);

    const geoJsonLayer = L.geoJSON(data, {
      pointToLayer: function (feature, latlng) {
        return L.circleMarker(latlng, {
          radius: 6,
          fillColor: "#ff4400",
          color: "#000",
          weight: 1,
          fillOpacity: 0.8
        });
      },
      onEachFeature: function (feature, layer) {
        if (feature.properties) {
          layer.bindPopup(`Asema: ${feature.properties.name}<br>T: ${feature.properties.t2m} °C`);
        }
      }
    });

    // 2. Viitataan uuteen muuttujan nimeen
    geoJsonLayer.addTo(myMap);
    
    const bounds = geoJsonLayer.getBounds();
    if (bounds.isValid()) {
      myMap.fitBounds(bounds);
    }
  })
  .catch(err => console.error("FETCH ERROR:", err));
</script>



</body>
</html>
