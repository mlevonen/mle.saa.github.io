<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
html, body { margin: 0; height: 100%; }
#map { height: 100%; width: 100%; }

.leaflet-popup-content {
  width: 420px !important;
}

.popup-title {
  font-weight: bold;
  margin-bottom: 6px;
}

.popup-chart {
  width: 400px;
  height: 200px;
}
</style>
</head>

<body>
<div id="map"></div>

<script>
"use strict";
const map = L.map("map").setView([60, 25], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

const FMI_WFS = "https://opendata.fmi.fi/wfs";

// ==========================
// Asemat kartalle
// ==========================
fetch("stations.json")
  .then(r => r.json())
  .then(data => {

    const layer = L.featureGroup().addTo(map);

    data.features.forEach(f => {
      const [lon, lat] = f.geometry.coordinates;
      const { name } = f.properties;

      const marker = L.circleMarker([lat, lon], {
        radius: 5,
        color: "blue",
        fillOpacity: 0.7
      }).addTo(layer);

      marker.bindPopup(`
        <div class="popup-title">${name}</div>
        <canvas
          class="popup-chart"
          width="400"
          height="200"
          data-lat="${lat}"
          data-lon="${lon}"
        ></canvas>
      `);
    });

    map.fitBounds(layer.getBounds(), { padding: [30, 30] });
  });

// ==========================
// FMI aikasarja (JSON TUETTU)
// ==========================
async function fetchTimeSeries(lat, lon, parameter) {
  const now = new Date();

  const start = new Date(now.getTime() - 6 * 3600_000).toISOString();
  const end   = now.toISOString(); // EI tulevaisuutta!

  const params = new URLSearchParams({
    service: "WFS",
    version: "2.0.0",
    request: "GetFeature",
    storedquery_id: "fmi::observations::weather::timevaluepair",
    latlon: `${Number(lat)},${Number(lon)}`,
    parameters: parameter,
    starttime: start,
    endtime: end,
    timestep: "60",
    outputFormat: "application/json"
  });

  const url = `${FMI_WFS}?${params}`;
  console.log("FMI REQUEST:", url);

  const res = await fetch(url);
  const text = await res.text();

  if (!res.ok || text.startsWith("<")) {
    console.error("FMI RAW RESPONSE:", text);
    return null;
  }

  return JSON.parse(text);
}


// ==========================
// FMI TimeSeries REST API
// ==========================
async function fetchTimeSeriesREST(lat, lon, params) {
  const now = new Date();
  const start = new Date(now.getTime() - 6 * 3600_000).toISOString();
  const end   = now.toISOString();

  const urlParams = new URLSearchParams({
    latlon: `${Number(lat)},${Number(lon)}`,
    starttime: start,
    endtime: end,
    format: "json",
    ...params
  });

  const url = `https://opendata.fmi.fi/timeseries?${urlParams}`;
  console.log("FMI REST REQUEST:", url);

  const res = await fetch(url);
  if (!res.ok) {
    throw new Error("FMI REST fetch failed");
  }

  return res.json();
}

// ==========================
// DEBUG popup – näytä RAW JSON
// ==========================
map.on("popupopen", async e => {
  const popupEl = e.popup.getElement();
  if (!popupEl) return;

  const lat = popupEl.querySelector("canvas")?.dataset.lat;
  const lon = popupEl.querySelector("canvas")?.dataset.lon;

  popupEl.innerHTML = `
    <div class="popup-title">FMI DEBUG</div>
    <div>Ladataan dataa…</div>
  `;

  try {
    const tempJson = await fetchTimeSeriesREST(lat, lon, {
      param: "temperature"
    });

    // 🔍 Näytä koko vastaus popupissa
    popupEl.innerHTML = `
      <div class="popup-title">FMI DEBUG – RAW JSON</div>
      <pre style="
        max-height: 300px;
        overflow: auto;
        background: #111;
        color: #0f0;
        padding: 8px;
        font-size: 11px;
      ">
${JSON.stringify(tempJson, null, 2)}
      </pre>
    `;

  } catch (err) {
    console.error(err);
    popupEl.innerHTML = `
      <div class="popup-title">Virhe</div>
      <pre>${err.message}</pre>
    `;
  }
});


</script>

</body>
</html>
