<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>


<style>
html, body { margin: 0; height: 100%; }
#map { height: 100%; width: 100%; }

.leaflet-popup-content {
  width: 420px !important;
}

.popup-title {
  font-weight: bold;
  margin-bottom: 6px;
}

.popup-chart {
  width: 400px;
  height: 200px;
}
</style>
</head>

<body>
<div id="map"></div>

<script>
"use strict";
const map = L.map("map").setView([60, 25], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

const FMI_WFS = "https://opendata.fmi.fi/wfs";

// ==========================
// Asemat kartalle
// ==========================
fetch("stations.json")
  .then(r => r.json())
  .then(data => {

    const layer = L.featureGroup().addTo(map);

    data.features.forEach(f => {
      const [lon, lat] = f.geometry.coordinates;
      const { name } = f.properties;

      const marker = L.circleMarker([lat, lon], {
        radius: 5,
        color: "blue",
        fillOpacity: 0.7
      }).addTo(layer);

marker.bindPopup(`
  <div class="popup-title">${name}</div>

  <div><strong>Lämpötila</strong></div>
  <canvas
    class="popup-chart"
    width="400"
    height="160"
    data-lat="${lat}"
    data-lon="${lon}"
    data-type="temp"
  ></canvas>

  <div style="margin-top:8px;"><strong>Tuuli</strong></div>
  <canvas
    class="popup-chart"
    width="400"
    height="160"
    data-lat="${lat}"
    data-lon="${lon}"
    data-type="wind"
  ></canvas>
`);

    });

    map.fitBounds(layer.getBounds(), { padding: [30, 30] });
  });

// ==========================
// FMI aikasarja (JSON TUETTU)
// ==========================
async function fetchTimeSeries(lat, lon, parameter) {
  const now = new Date();

  const start = new Date(now.getTime() - 6 * 3600_000).toISOString();
  const end   = now.toISOString(); // EI tulevaisuutta!

  const params = new URLSearchParams({
    service: "WFS",
    version: "2.0.0",
    request: "GetFeature",
    storedquery_id: "fmi::observations::weather::timevaluepair",
    latlon: `${Number(lat)},${Number(lon)}`,
    parameters: parameter,
    starttime: start,
    endtime: end,
    timestep: "60",
    outputFormat: "application/json"
  });

  const url = `${FMI_WFS}?${params}`;
  console.log("FMI REQUEST:", url);

  const res = await fetch(url);
  const text = await res.text();

  if (!res.ok || text.startsWith("<")) {
    console.error("FMI RAW RESPONSE:", text);
    return null;
  }

  return JSON.parse(text);
}


// ==========================
// FMI TimeSeries REST API
// ==========================
async function fetchTimeSeriesREST(lat, lon, params) {
  const now = new Date();
  const past = new Date(now.getTime() - 6 * 3600_000).toISOString();
  const future = new Date(now.getTime() + 6 * 3600_000).toISOString();

  const urlParams = new URLSearchParams({
    latlon: `${Number(lat)},${Number(lon)}`,
    starttime: past,
    endtime: future,
    format: "json",
    ...params
  });

  const url = `https://opendata.fmi.fi/timeseries?${urlParams}`;
  console.log("FMI REST REQUEST:", url);

  const res = await fetch(url);
  if (!res.ok) throw new Error("FMI REST fetch failed");

  return res.json();
}


function splitPastFuture(values) {
  const mid = Math.floor(values.length / 2);
  return {
    past: values.slice(0, mid),
    future: values.slice(mid)
  };
}


// ==========================
// Popup → lämpötila + tuuli (havainto + ennuste)
// ==========================
map.on("popupopen", async e => {
  const popupEl = e.popup.getElement();
  if (!popupEl) return;

  const canvases = popupEl.querySelectorAll("canvas");
  if (canvases.length === 0) return;

  const lat = canvases[0].dataset.lat;
  const lon = canvases[0].dataset.lon;

  try {
    // --- DATA ---
    const tempJson = await fetchTimeSeriesREST(lat, lon, {
      param: "temperature"
    });
    const windSpeedJson = await fetchTimeSeriesREST(lat, lon, {
      param: "windspeedms"
    });
    const windDirJson = await fetchTimeSeriesREST(lat, lon, {
      param: "winddirection"
    });

    // --- LÄMPÖTILA ---
    if (Array.isArray(tempJson) && tempJson.length > 0) {
const values = tempJson.map(p => p.temperature);
const nowIndex = Math.floor(values.length / 2);

const tempCanvas = popupEl.querySelector('canvas[data-type="temp"]');


new Chart(tempCanvas.getContext("2d"), {
  type: "line",
  data: {
    labels: values.map((_, i) => i),
datasets: [
  {
    label: "Havainto",
    data: [...past, ...Array(future.length).fill(null)],
    borderColor: "blue",
    tension: 0.3
  },
  {
    label: "Ennuste",
    data: [...Array(past.length).fill(null), ...future],
    borderColor: "red",
    borderDash: [6, 4],
    tension: 0.3
  }
]

  },
  options: {
    responsive: false,
    plugins: {
      legend: { display: false },
      annotation: {
        annotations: {
          nowLine: {
            type: "line",
            xMin: nowIndex,
            xMax: nowIndex,
            borderColor: "black",
            borderWidth: 2,
            label: {
              display: true,
              content: "NYT",
              position: "start"
            }
          }
        }
      }
    },
    scales: {
      y: {
        title: { display: true, text: "°C" }
      }
    }
  }
});
    }

    // --- TUULI ---
    if (Array.isArray(windSpeedJson) && windSpeedJson.length > 0) {
const values = windSpeedJson.map(p => p.windspeedms);
const { past, future } = splitPastFuture(values);
const nowIndex = Math.floor(values.length / 2);

      const windCanvas = popupEl.querySelector('canvas[data-type="wind"]');

      new Chart(windCanvas.getContext("2d"), {
        type: "line",
        data: {
          labels: values.map((_, i) => i),
          datasets: [
            {
              label: "Havainto",
              data: [...past, ...Array(future.length).fill(null)],
              borderColor: "green",
              tension: 0.3
            },
            {
              label: "Ennuste",
              data: [...Array(past.length).fill(null), ...future],
              borderColor: "red",
              borderDash: [6, 4],
              tension: 0.3
            }
          ]
        },
options: {
  responsive: false,
  plugins: {
    legend: { display: false },
    annotation: {
      annotations: {
        nowLine: {
          type: "line",
          xMin: nowIndex,
          xMax: nowIndex,
          borderColor: "black",
          borderWidth: 2,
          label: {
            display: true,
            content: "NYT",
            position: "start"
          }
        }
      }
    }
  },
  scales: {
    y: { title: { display: true, text: "m/s" } }
  }
}


    // --- TUULENSUUNTA ---
    const latestDir =
      Array.isArray(windDirJson)
        ? windDirJson.at(-1)?.winddirection
        : null;

    if (latestDir !== null) {
      const title = popupEl.querySelector(".popup-title");
      if (title && !title.dataset.windAdded) {
        title.dataset.windAdded = "1";
        title.insertAdjacentHTML(
          "beforeend",
          ` <span style="
              display:inline-block;
              transform:rotate(${latestDir + 180}deg);
              font-size:18px;
            ">➤</span>`
        );
      }
    }

  } catch (err) {
    console.error(err);
    popupEl.innerHTML += `<div>Virhe FMI-datan haussa</div>`;
  }
});


</script>

</body>
</html>
