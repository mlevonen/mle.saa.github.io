<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;height:100%}
#map{height:100%;width:100%}
</style>
</head>
<body>

<div id="map"></div>

<script>
fetch("observations.json")
  .then(r => r.json())
  .then(data => {
    console.log("GEOJSON LOADED", data);

    const layer = L.geoJSON(data, {
      // Käytetään ympyröitä markkereiden sijaan (varmempi toimivuus)
      pointToLayer: function (feature, latlng) {
        return L.circleMarker(latlng, {
          radius: 8,
          fillColor: "#ff7800",
          color: "#000",
          weight: 1,
          opacity: 1,
          fillOpacity: 0.8
        });
      },
      // Lisätään tietolaatikko, joka näyttää JSON-datasi kentät
      onEachFeature: function (feature, layer) {
        if (feature.properties) {
          const p = feature.properties;
          layer.bindPopup(`
            <strong>${p.name}</strong><br>
            Lämpötila: ${p.t2m} °C<br>
            Tuuli: ${p.ws} m/s
          `);
        }
      }
    });

    layer.addTo(map);
    
    // Zoomataan automaattisesti kattamaan kaikki havainnot
    if (data.features.length > 0) {
      map.fitBounds(layer.getBounds());
    }
  })
  .catch(err => console.error("FETCH ERROR", err));

</script>


</body>
</html>
