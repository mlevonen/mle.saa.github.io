<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;height:100%}
#map{height:100%;width:100%}
</style>
</head>
<body>

<div id="map"></div>

<script>
console.log("SCRIPT STARTED");

// 1. Alustetaan kartta
const map = L.map("map").setView([60, 25], 6);
console.log("MAP CREATED", map);

// 2. Lisätään taustakartta
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// 3. Haetaan data
fetch("observations.json")
  .then(r => {
    if (!r.ok) throw new Error("HTTP error " + r.status);
    return r.json();
  })
  .then(data => {
    console.log("GEOJSON LOADED", data);

    // Luodaan GeoJSON-kerros
    const geoJsonLayer = L.geoJSON(data, {
      pointToLayer: function (feature, latlng) {
        // Luodaan ympyrä jokaiselle pisteelle
        return L.circleMarker(latlng, {
          radius: 6,
          fillColor: "#ff4400",
          color: "#000",
          weight: 1,
          opacity: 1,
          fillOpacity: 0.8
        });
      },
      onEachFeature: function (feature, layer) {
        if (feature.properties) {
          const p = feature.properties;
          layer.bindPopup(`
            <strong>${p.name || 'Sääasema'}</strong><br>
            Lämpötila: ${p.t2m ?? '?'} °C<br>
            Tuuli: ${p.ws ?? '?'} m/s
          `);
        }
      }
    });

    // TÄRKEÄ: Lisätään kerros karttaan
    geoJsonLayer.addTo(map);
    console.log("LAYER ADDED TO MAP");

    // Säädetään näkymä kattamaan kaikki pisteet
    const bounds = geoJsonLayer.getBounds();
    if (bounds.isValid()) {
      map.fitBounds(bounds);
    }
  })
  .catch(err => {
    console.error("FETCH ERROR:", err.message);
  });
</script>


</body>
</html>
