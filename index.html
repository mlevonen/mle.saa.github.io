<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;height:100%}
#map{height:100%;width:100%}
</style>
</head>
<body>

<div id="map"></div>

<script>
console.log("SCRIPT STARTED");

const map = L.map("map").setView([60, 25], 6);
console.log("MAP CREATED", map);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
console.log("TILE LAYER ADDED");

fetch("observations.json")
  .then(r => r.json())
  .then(data => {
    console.log("GEOJSON LOADED", data);
    
    // Uusi, korjattu tapa käsitellä pisteitä
    const layer = L.geoJSON(data, {
      pointToLayer: function (feature, latlng) {
        // Käytetään ympyrämarkkeria markkerikuvan sijaan
        return L.circleMarker(latlng, {
          radius: 8,
          fillColor: "#ff7800",
          color: "#000",
          weight: 1,
          opacity: 1,
          fillOpacity: 0.8
        });
      },
      onEachFeature: function (feature, layer) {
        if (feature.properties) {
          const p = feature.properties;
          layer.bindPopup(`
            <strong>${p.name}</strong><br>
            Lämpötila: ${p.t2m} °C<br>
            Tuuli: ${p.ws} m/s
          `);
        }
      }
    });

    layer.addTo(map);

    console.log("LAYER ADDED", layer);
    
    // Zoomataan automaattisesti kattamaan kaikki havainnot, jos dataa on
    if (layer.getBounds().isValid()) {
      map.fitBounds(layer.getBounds());
    }

  })
  .catch(err => console.error("FETCH ERROR", err));
</script>

</body>
</html>
