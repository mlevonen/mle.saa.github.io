<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot ja ennuste</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body { margin: 0; height: 100%; }
#map { height: 100%; width: 100%; }
</style>
</head>
<body>

<div id="map"></div>

<script>
console.log("SCRIPT STARTED");

// ==========================
// Kartta
// ==========================
const map = L.map("map").setView([60, 25], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

// ==========================
// Havainnot layer
// ==========================
const obsLayer = L.layerGroup().addTo(map);

// ==========================
// Lämpötilavärit
// ==========================
function tempColor(t) {
  if (t == null || isNaN(t)) return "#999";
  if (t <= -20) return "#08306b";
  if (t <= -10) return "#2171b5";
  if (t <= 0)   return "#6baed6";
  if (t <= 10)  return "#fee08b";
  if (t <= 20)  return "#fdae61";
  return "#d73027";
}

// ==========================
// TUULINUOLI (SVG)
// ==========================
function windArrowIcon(dir, color) {
  const rot = (dir ?? 0) - 180;
  return L.divIcon({
    className: "",
    iconSize: [24, 24],
    html: `
      <svg width="24" height="24" viewBox="0 0 100 100"
           style="transform: rotate(${rot}deg)">
        <polygon points="50,0 90,100 50,75 10,100"
                 fill="${color}" />
      </svg>
    `
  });
}

// ==========================
// Havaintojen haku
// ==========================
fetch("observations.json")
  .then(r => r.json())
  .then(data => {
    console.log("OBS FEATURES", data.features.length);

    data.features.forEach(f => {
      const [lon, lat] = f.geometry.coordinates;
      const p = f.properties;

      const marker = L.marker([lat, lon], {
        icon: windArrowIcon(p.wd, tempColor(p.t2m))
      });

      marker.bindPopup(() => {
        const temp = (p.t2m !== null && !isNaN(p.t2m))
          ? `${p.t2m.toFixed(1)} °C`
          : "–";

        const ws = (p.ws !== null && !isNaN(p.ws))
          ? `${p.ws.toFixed(1)} m/s`
          : "–";

        const wd = (p.wd !== null && !isNaN(p.wd))
          ? `${Math.round(p.wd)}°`
          : "–";

        return `
          <strong>${p.station}</strong><br>
          🌡 ${temp}<br>
          💨 ${ws}<br>
          🧭 ${wd}
        `;
      });

      marker.addTo(obsLayer);
    });

    if (obsLayer.getLayers().length > 0) {
      map.fitBounds(obsLayer.getBounds(), { padding: [30, 30] });
    }
  })
  .catch(err => console.error("OBS FETCH ERROR", err));
</script>

</body>
</html>
