<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;height:100%}
#map{height:100%;width:100%}
</style>
</head>
<body>

<div id="map"></div>

<script>
console.log("SCRIPT STARTED");

const map = L.map("map").setView([60, 25], 6);
console.log("MAP CREATED", map);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
console.log("TILE LAYER ADDED");

fetch("observations.json")
  .then(r => {
    console.log("FETCH RESPONSE", r);
    return r.json();
  })
  .then(data => {
    console.log("GEOJSON LOADED", data);
    console.log("FEATURE COUNT", data.features.length);

    const layer = L.geoJSON(data).addTo(map);
    console.log("LAYER ADDED", layer);

    // 🔧 TÄRKEÄ KORJAUS: odota hetki ennen fitBoundsia
    setTimeout(() => {
      map.fitBounds(layer.getBounds(), { padding: [20, 20] });
      console.log("BOUNDS FITTED");
    }, 100);
  })
  .catch(err => console.error("FETCH ERROR", err));
</script>

</body>
</html>
