<title>FMI Sääkartta – Havainnot</title>

<script>
  // Ohjaa kapeat näytöt (puhelimet) automaattisesti mobiiliversioon.
  // HUOM: window.innerWidth kertoo todellisen näytön leveyden vain
  // kun yllä oleva viewport-meta on läsnä – ilman sitä mobiiliselain
  // raportoisi virtuaalisen "työpöytäleveyden" (esim. 980px) eikä
  // ohjaus koskaan laukeaisi oikeilla puhelimilla. Suoritetaan heti
  // <head>:n alussa, ennen raskaampien resurssien (Leaflet, kartta)
  // latausta, jotta uudelleenohjaus on välitön eikä työpöytäversio
  // ehdi vilahtaa näkyviin. location.replace ei jätä väliaskelta
  // selaimen historiaan, jotta "edellinen sivu" -painike toimii
  // järkevästi.
  (function () {
    var MOBILE_BREAKPOINT_PX = 768;
    if (window.innerWidth <= MOBILE_BREAKPOINT_PX) {
      window.location.replace("mobile.html");
    }
  })();
</script>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html, body { margin: 0; height: 100%; }
#map { height: 100%; width: 100%; }

.leaflet-popup-content {
  width: auto !important;
  /* Leafletin shrink-to-fit-leveys perustuu popupin sisällä olevaan
     LEVEIMPÄÄN riviin. Kun ylimmän yhteenvetokortin ruudukko
     (.current-conditions-grid) käyttää flex-wrap-tyyliä eikä yhtä
     kiinteää leveyttä, se ei enää itsessään pakota popupia riittävän
     leveäksi – koko popup kapeni ja osa sisällöstä (mm. tuntikohtaisen
     sääennusteen loppupää) jäi vierittyvän alueen taakse "piiloon"
     oikeaan reunaan. min-width takaa popupille riittävän leveyden
     riippumatta siitä mikä rivi sattuu olemaan leveintä. */
  min-width: 660px;
}

.leaflet-popup-content-wrapper {
  max-width: 785px;
  background: #f2f3f5;
}

.popup-title {
  font-weight: bold;
  font-size: 17px;
  margin-bottom: 6px;
}

/* Jokainen graafi/osio omana "kelluvana" korttinaan */
.popup-card {
  background: #fff;
  border: 1px solid #e3e3e3;
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  box-sizing: border-box;
}

/* Kevyempi sisäkorttityyli (esim. pienoisgraafi ison kortin sisällä) */
.popup-card-inner {
  background: #fafafa;
  border: 1px solid #e8e8e8;
  border-radius: 8px;
  padding: 6px 8px;
  box-sizing: border-box;
}

/* Huomautuskortti (esim. eri ennustemallien ero) */
.popup-note {
  background: #fff8e1;
  border: 1px solid #f0dfa0;
  border-radius: 10px;
  padding: 8px 10px;
  font-size: 12px;
  line-height: 1.4;
  color: #6b5900;
  margin-bottom: 12px;
  box-sizing: border-box;
}

/* ==========================
   Ylin yhteenvetokortti ("tämänhetkinen tilanne") – tarkoituksella
   tummempi kuin muut kortit, jotta se erottuu heti popupin
   avautuessa. Sisältää tuulen (havainto), lämpötilan, vedenkorkeuden,
   aallokon (jos relevantti) ja auringon nousun/laskun. Vastaavat
   yksittäiset lukemat on poistettu popupin muista osioista – vain
   tämä kortti näyttää ne, graafit/animaatio näyttävät edelleen
   kehityksen/trendin. Ks. js/popup/currentConditionsCard.js.
   ========================== */

.popup-current-card {
  background: #1c3f5f;
  border-color: #0f2a44;
  color: #eaf1f8;
}

.popup-current-card .popup-title {
  color: #fff;
  /* Aseman nimi näkyvämmäksi – tuulilukeman fontti (ks. alla) on
     muutenkin suurempi kuin oletus-.popup-title, joten nimen on
     hyvä olla selvästi sitäkin isompi. */
  font-size: 24px;
  margin-bottom: 8px;
}

/* Jokainen tietoryhmä (Tuuli, Lämpötila, Vedenkorkeus, Aallokko,
   Aurinko, Sääennuste) on oma alakorttinsa (.popup-card-inner) tässä
   YHDESSÄ CSS Grid -ruudukossa. Grid (ei flex-wrap) takaa, että
   kortit asettuvat tasan sekä vaaka- että pystysuunnassa: jokaisen
   rivin korkeus ja jokaisen sarakkeen leveys ovat aina yhtenäiset
   riippumatta yksittäisten korttien sisällön määrästä. */
.current-conditions-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 8px;
}

.current-conditions-item {
  display: flex;
  flex-direction: column;
}

/* Sääennuste tarvitsee enemmän tilaa vaakavierittyvälle
   tuntilistalle, joten se vie koko ruudukon leveyden omana rivinään. */
.current-conditions-item-wide {
  grid-column: 1 / -1;
}

/* Alakorttien tumma tyyli (perus-.popup-card-inner on suunniteltu
   vaaleaa taustaa varten muualla popupissa). */
.popup-current-card .popup-card-inner {
  background: rgba(255,255,255,0.08);
  border-color: rgba(255,255,255,0.18);
  padding: 10px 12px;
}

.current-label {
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 3px;
  color: #9fc1de;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

.current-wind-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Nuolilaatikon absoluuttinen sijoittelu edellyttää, että itse
   Tuuli-alakortti on positiointikonteksti. */
.current-wind-item {
  position: relative;
}

/* Nuolen oma vaalea "kortti" – nuolen väri vaihtelee tuulen mukaan
   (ks. alla), ja osa väreistä (esim. sininen) hukkuisi tumman
   yleistaustan päällä. Vaalea keltainen/beige tausta pitää nuolen
   aina hyvin erottuvana, eikä ole yhtä "kirkas" kuin puhdas
   valkoinen. Sijoitettu kortin oikeaan yläkulmaan, jotta se erottuu
   omana elementtinään lämpötila-/asteluvusta. */
.current-wind-arrow-box {
  position: absolute;
  top: 8px;
  right: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 52px;
  height: 52px;
  border-radius: 8px;
  background: #f5e9bd;
  border: 1px solid #d9c98a;
}

/* Tuulinuoli – sama SVG-muoto kuin kartan tuuli-ikoneissa
   (createWindIcon(), js/main.js) ja väri vaihtuu tuulen nopeuden
   mukaan JS:ssä (ks. renderCurrentWindSummary/windSpeedColor,
   js/popup/currentConditionsCard.js) samalla nopeusasteikolla kuin
   kartalla. */
.current-wind-arrow {
  display: inline-flex;
  color: #bfe0ff;
  transition: color 0.2s ease;
}

.current-wind-dir {
  font-size: 22px;
  font-weight: 700;
  color: #eaf1f8;
}

.current-wind-speed {
  margin-top: 2px;
  font-size: 18px;
  font-weight: 700;
  color: #bfe0ff;
}

.popup-current-card .popup-temp-value {
  font-size: 26px;
  color: #ffab91;
}

/* Lämpötila+Aurinko ja Vedenkorkeus+Aallokko ovat kumpikin kaksi
   pinottua, itsenäisesti piiloutuvaa lohkoa saman alakortin sisällä
   – erotettu kevyellä jakoviivalla, kun molemmat ovat näkyvissä. */
.current-temp-sun-card,
.current-sealevel-wave-card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  height: 100%;
}

.current-temp-sun-card > div:not(:first-child),
.current-sealevel-wave-card > div:not(:first-child) {
  padding-top: 10px;
  border-top: 1px solid rgba(255,255,255,0.15);
}

.popup-current-card .wind-flow-sealevel-label {
  color: #9fc1de;
}

.popup-current-card .wind-flow-sealevel-value {
  color: #bfe0ff;
}

.popup-current-card .popup-wave-height-value {
  color: #bfe0ff;
}

.popup-current-card .popup-wave-period-label {
  color: #9fc1de;
}

.popup-current-card .popup-wave-period-value {
  color: #eaf1f8;
}

.popup-current-card .popup-inline-item:not(:first-child)::before {
  border-left-color: rgba(255,255,255,0.25);
}

.current-sunrise-value,
.current-sunset-value {
  color: #eaf1f8;
  font-weight: 600;
}

.popup-current-card .popup-hourly-day {
  color: #9fc1de;
  font-size: 12px;
}

/* Sääennuste-alakortti on koko leveä, joten tuntikohtaiset ikonit
   voivat olla hieman isompia kuin popupin muualla käytetty
   pienoiskoko – mutta kohtuudella, jotta rivi mahtuu kortin
   sisään eikä ala vaakavierimään (aiemmin liian suuret koot
   aiheuttivat sivuttaisscrollauksen). */
.popup-current-card .popup-hourly-forecast {
  gap: 6px;
}

.popup-current-card .popup-hourly-item {
  width: 40px;
}

.popup-current-card .popup-hourly-icon {
  width: 28px;
  height: 28px;
}

.popup-current-card .popup-hourly-hour {
  font-size: 12px;
  color: #cfe0f0;
}

.popup-current-card .popup-hourly-temp {
  font-size: 13px;
  color: #ffab91;
}

/* Graafin kääre: KIINTEÄ korkeus (ei riipu sisällöstä), leveys 100 %
   popup-kortin todellisesta (Leafletin shrink-to-fit-määrittämästä)
   leveydestä. Chart.js:n responsive:true mittaa tämän kääreen –
   koska korkeus on kiinteä pikseliarvo eikä riipu itse kanvaasin
   koosta, mittaus ei enää voi ruokkia itseään (aiempi bugi: Leaflet-
   popupin autosize + Chart.js:n ResizeObserver venyttivät graafin
   kymmenien senttien korkuiseksi). Koska leveys on 100 %, kanvaasi
   täyttää aina koko popupin oikean leveyden sen sijaan että jäisi
   kapeammaksi kiinteällä pikseliarvolla. */
.popup-chart-wrapper {
  width: 100%;
  height: 200px;
}

.popup-chart {
  width: 100% !important;
  height: 100% !important;
}

.popup-chart-mini {
  width: 300px;
  height: 110px;
}

/* Tuuliennusteanimaatio – levitetty samaan leveyteen graafien kanssa
   (sama kääre+kiinteä-korkeus-periaate kuin .popup-chart-wrapper).
   Kanvaasien todellinen piirtoresoluutio synkronoidaan tähän kokoon
   JS:ssä (ks. js/popup/windFlowAnimation.js), joten animaatio pysyy
   terävänä vaikka se ei enää olekaan neliö. */
.wind-flow-wrapper {
  position: relative;
  width: 100%;
  height: 260px;
}

.wind-flow-bg,
.wind-flow-canvas {
  position: absolute;
  top: 0;

  height: 100%;
}

.popup-extras {

  gap: 8px;

}

.popup-pressure {

}

.popup-extras {

  margin-bottom: 6px;
}

.wind-flow-sealevel-row {

}

.wind-flow-sealevel-label {

}

.wind-flow-sealevel-value {

.popup-pressure {

.popup-metrics {

  margin-top: 6px;
}

.popup-row {
  display: flex;
  align-items: center;
  gap: 6px;

}

.popup-icon {
  width: 18px;

}

.popup-row {

  white-space: nowrap;
}

.popup-inline-metrics {

.popup-inline-item {

.popup-temp-value {

}

.popup-sun-row {

/* Automaattinen pystyerotin */
.popup-inline-item:not(:first-child)::before {
  content: "";
  border-left: 1px solid rgba(0,0,0,0.25);

}
