<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
html,body{margin:0;height:100%}
#map{height:100%;width:100%}
</style>
</head>
<body>

<div id="map"></div>

<script>
const map = L.map('map').setView([64.5, 26], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

function tempColor(t){
 if(t==null||isNaN(t))return '#999';
 if(t<=-20)return '#08306b';
 if(t<=-10)return '#2171b5';
 if(t<=0)return '#6baed6';
 if(t<=10)return '#fee08b';
 if(t<=20)return '#fdae61';
 return '#d73027';
}

fetch('observations.json')
.then(r => r.json())
.then(data => {
  console.log("OBS FEATURES:", data.features.length);

  data.features.forEach(f => {
    const [lon, lat] = f.geometry.coordinates;
    const p = f.properties;

    L.circleMarker([lat, lon], {
      radius: 7,
      color: '#333',
      fillColor: tempColor(p.t2m),
      fillOpacity: 0.85
    })
    .bindPopup(
      `<b>${p.name}</b><br>
       Lämpötila: ${p.t2m ?? '-'} °C<br>
       Tuuli: ${p.ws ?? '-'} m/s`
    )
    .addTo(map);
  });
});
</script>

</body>
</html>
