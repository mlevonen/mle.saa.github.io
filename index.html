<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FMI Sääkartta – Ennuste</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body { margin: 0; height: 100%; }
#map { height: 100%; width: 100%; }

.popup-title {
  font-weight: bold;
  margin-bottom: 6px;
}
</style>
</head>
<body>

<div id="map"></div>

<script>
console.log("SCRIPT STARTED");

// ==========================
// Kartta
// ==========================
const map = L.map("map").setView([60, 25], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

// ==========================
// Lämpötilavärit
// ==========================
function tempColor(t) {
  if (t == null || isNaN(t)) return "#999";
  if (t <= -20) return "#08306b";
  if (t <= -10) return "#2171b5";
  if (t <= 0)   return "#6baed6";
  if (t <= 10)  return "#fee08b";
  if (t <= 20)  return "#fdae61";
  return "#d73027";
}

// ==========================
// Tuulinuoli (SVG)
// ==========================
function windArrowIcon(dir, color) {
  const rot = (dir ?? 0) - 180;
  return L.divIcon({
    className: "",
    iconSize: [26, 26],
    html: `
      <svg width="26" height="26" viewBox="0 0 100 100"
           style="transform: rotate(${rot}deg)">
        <polygon points="50,0 90,100 50,75 10,100"
                 fill="${color}" />
      </svg>
    `
  });
}

// ==========================
// Lämpötilakäyrä (SVG)
// ==========================
function temperatureChart(rows) {
  const w = 180;
  const h = 60;

  const values = rows
    .map(r => r.t2m)
    .filter(v => v !== null && !isNaN(v));

  if (values.length < 2) {
    return "<em>Ei riittävästi ennustetta</em>";
  }

  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;

  let path = "";

  values.forEach((v, i) => {
    const x = (i / (values.length - 1)) * w;
    const y = h - ((v - min) / range) * h;
    path += (i === 0 ? "M" : "L") + x + "," + y;
  });

  return `
    <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      <path d="${path}"
            fill="none"
            stroke="#d73027"
            stroke-width="2"/>
      <text x="4" y="12" font-size="10">${min.toFixed(1)}°</text>
      <text x="4" y="${h - 4}" font-size="10">${max.toFixed(1)}°</text>
    </svg>
  `;
}

// ==========================
// Ennusteiden haku
// ==========================
fetch("forecast.json")
  .then(r => r.json())
  .then(data => {

    console.log("FC FEATURES", data.features.length);

    // ==========================
    // Ryhmittely kaupungeittain
    // ==========================
    const byCity = {};

    data.features.forEach(f => {
      const p = f.properties;
      if (!byCity[p.city]) {
        byCity[p.city] = {
          coords: f.geometry.coordinates,
          rows: []
        };
      }
      byCity[p.city].rows.push(p);
    });

    const layer = L.layerGroup().addTo(map);

    // ==========================
    // Markerit + popupit
    // ==========================
    Object.entries(byCity).forEach(([city, data]) => {
      const [lon, lat] = data.coords;

      // aikajärjestys
      data.rows.sort((a, b) => a.time.localeCompare(b.time));

      const first = data.rows[0];

      const marker = L.marker([lat, lon], {
        icon: windArrowIcon(first.wd, tempColor(first.t2m))
      });

      const popupHtml = `
        <div class="popup-title">${city}</div>
        ${temperatureChart(data.rows)}
      `;

      marker.bindPopup(popupHtml);
      marker.addTo(layer);
    });

    if (layer.getLayers().length > 0) {
      map.fitBounds(layer.getBounds(), { padding: [30, 30] });
    }
  })
  .catch(err => console.error("FORECAST FETCH ERROR", err));
</script>

</body>
</html>
