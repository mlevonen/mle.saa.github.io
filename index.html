<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="icon" href="data:,">

<style>

html, body { margin: 0; height: 100%; }
#map { height: 100%; width: 100%; }

.leaflet-popup-content {
  width: auto !important;
}

.leaflet-popup-content-wrapper {
  max-width: 760px;
}

.popup-title {
  font-weight: bold;
  margin-bottom: 6px;
}

.popup-chart {
  width: 560px;   /* +40 % */
  height: 200px;
}

.popup-extras {
  display: flex;
  flex-direction: column;  /* 🔹 TÄRKEÄ */
  gap: 8px;
  margin-bottom: 6px;
}

.weather-icon {
  width: 36px;
  height: 36px;
}

.popup-pressure {
  font-size: 0.9rem;
  color: #222;
  white-space: nowrap;
}

.popup-extras {
  display: flex;
  gap: 10px;
  font-size: 13px;
  margin-bottom: 6px;
}

.popup-sealevel {
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.popup-sealevel-icon {
  width: 18px;
  height: 18px;
}

.popup-pressure {
  white-space: nowrap;
}

.popup-pressure--na {
  opacity: 0.6;
  font-style: italic;
}

.popup-weather-symbol {
  display: flex;
  justify-content: center;
  margin: 4px 0 8px;
}

.popup-weather-icon {
  width: 42px;
  height: 42px;
  display: block;
}

.popup-metrics {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 6px;
}

.popup-row {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.popup-icon {
  width: 18px;
  height: 18px;
  display: block;
}

.popup-row {
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

</style>

</head>

<body>
  <div id="map"></div>

  <!-- Leaflet ensin -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js ja adapterit -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1"></script>

  <!-- OMA KOODI VIIMEISENÄ -->
  <script type="module" src="js/main.js"></script>

</body>
</html>
