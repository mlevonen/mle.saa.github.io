<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot ja ennuste</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body { margin: 0; height: 100%; }
#map { height: 100%; width: 100%; }
</style>
</head>
<body>

<div id="map"></div>

<script>
console.log("SCRIPT STARTED");

// ==========================
// GLOBAALIT LAYER-MUUTTUJAT
// ==========================
let obsLayer = null;
let fcLayer  = null;

// ==========================
// KARTTA
// ==========================
const map = L.map("map").setView([60, 25], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

// ==========================
// LÄMPÖTILAN VÄRIT
// ==========================
function tempColor(t) {
  if (t == null || isNaN(t)) return "#999";
  if (t <= -20) return "#08306b";
  if (t <= -10) return "#2171b5";
  if (t <= 0)   return "#6baed6";
  if (t <= 10)  return "#fee08b";
  if (t <= 20)  return "#fdae61";
  return "#d73027";
}

// ==========================
// HAVAINNOT
// ==========================
fetch("observations.json")
  .then(r => r.json())
  .then(data => {
    console.log("OBS FEATURES", data.features.length);

    obsLayer = L.geoJSON(data, {
      pointToLayer: (feature, latlng) => {
        const t = feature.properties.t2m;
        return L.circleMarker(latlng, {
          radius: 6,
          fillColor: tempColor(t),
          fillOpacity: 0.85,
          color: "#333",
          weight: 1
        });
      },
      onEachFeature: (feature, layer) => {
        const p = feature.properties;
        layer.bindPopup(`
          <strong>${p.station}</strong><br>
          🌡 ${p.t2m ?? "–"} °C<br>
          💨 ${p.ws ?? "–"} m/s
        `);
      }
    });

    obsLayer.addTo(map);

    // zoom vain jos layerissä on pisteitä
    if (obsLayer.getLayers().length > 0) {
      map.fitBounds(obsLayer.getBounds());
    }

    tryAddLayerControl();
  })
  .catch(err => console.error("OBS FETCH ERROR", err));

// ==========================
// ENNUSTE
// ==========================
fetch("forecast.json")
  .then(r => r.json())
  .then(fc => {
    console.log("FC FEATURES", fc.features.length);

    fcLayer = L.geoJSON(fc, {
      pointToLayer: (feature, latlng) => {
        const t = feature.properties.t2m;
        return L.circleMarker(latlng, {
          radius: 5,
          fillColor: tempColor(t),
          fillOpacity: 0.6,
          color: "#000",
          weight: 1
        });
      },
      onEachFeature: (feature, layer) => {
        const p = feature.properties;
        layer.bindPopup(`
          <strong>${p.city}</strong><br>
          🌡 ${p.t2m ?? "–"} °C<br>
          💨 ${p.ws ?? "–"} m/s
        `);
      }
    });

    fcLayer.addTo(map);
    tryAddLayerControl();
  })
  .catch(err => console.error("FC FETCH ERROR", err));

// ==========================
// LAYER CONTROL (lisätään vain kerran)
// ==========================
let layerControlAdded = false;

function tryAddLayerControl() {
  if (layerControlAdded) return;
  if (!obsLayer || !fcLayer) return;

  L.control.layers(null, {
    "Havainnot": obsLayer,
    "Ennuste": fcLayer
  }, { collapsed: false }).addTo(map);

  layerControlAdded = true;
  console.log("LAYER CONTROL ADDED");
}
</script>

</body>
</html>
