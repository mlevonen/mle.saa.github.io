<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body { margin: 0; height: 100%; }
#map { height: 100%; width: 100%; }

.popup-title {
  font-weight: bold;
  margin-bottom: 6px;
}
</style>
</head>
<body>

<div id="map"></div>

<script>
// ==========================
// Kartta
// ==========================
const map = L.map("map").setView([60, 25], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

// ==========================
// Lämpötilavärit
// ==========================
function tempColor(t) {
  if (t == null || isNaN(t)) return "#999";
  if (t <= -20) return "#08306b";
  if (t <= -10) return "#2171b5";
  if (t <= 0)   return "#6baed6";
  if (t <= 10)  return "#fee08b";
  if (t <= 20)  return "#fdae61";
  return "#d73027";
}

// ==========================
// Tuulinuoli
// ==========================
function windArrowIcon(dir, color) {
  const rot = (dir ?? 0) - 180;
  return L.divIcon({
    className: "",
    iconSize: [24, 24],
    html: `
      <svg width="24" height="24" viewBox="0 0 100 100"
           style="transform: rotate(${rot}deg)">
        <polygon points="50,0 90,100 50,75 10,100"
                 fill="${color}" />
      </svg>
    `
  });
}

// ==========================
// YKSINKERTAINEN lämpötilagraafi
// ==========================
function temperatureChart(values) {
  if (values.length < 2) return "<em>Ei graafia</em>";

  const w = 160, h = 50;
  const min = Math.min(...values);
  const max = Math.max(...values);
  const r = max - min || 1;

  let d = "";
  values.forEach((v, i) => {
    const x = (i / (values.length - 1)) * w;
    const y = h - ((v - min) / r) * h;
    d += (i === 0 ? "M" : "L") + x + "," + y;
  });

  return `
    <svg width="${w}" height="${h}">
      <path d="${d}" stroke="#d73027" stroke-width="2" fill="none"/>
    </svg>
  `;
}

// ==========================
// LIITTYY GRAAFIIN
// ==========================


function tempSparkline(values) {
  const w = 180, h = 50, pad = 5;

  const clean = values.filter(v => v !== null && !isNaN(v));
  if (clean.length < 2) return "<em>Ei graafia</em>";

  const min = Math.min(...clean);
  const max = Math.max(...clean);
  const scaleX = (i) => pad + i * (w - 2*pad) / (values.length - 1);
  const scaleY = (v) =>
    h - pad - (v - min) * (h - 2*pad) / (max - min || 1);

  let path = "";
  values.forEach((v, i) => {
    if (v == null || isNaN(v)) return;
    path += `${path ? "L" : "M"}${scaleX(i)},${scaleY(v)} `;
  });

  return `
    <svg width="${w}" height="${h}">
      <path d="${path}" fill="none" stroke="#d73027" stroke-width="2"/>
      <text x="4" y="12" font-size="10">${min.toFixed(1)}°</text>
      <text x="4" y="${h-4}" font-size="10">${max.toFixed(1)}°</text>
    </svg>
  `;
}



// ==========================
// HAVAINNOT
// ==========================
fetch("observations.json")
  .then(r => r.json())
  .then(data => {
    console.log("OBS FEATURES", data.features.length);

    // ==========================
    // Ryhmittely aseman mukaan
    // ==========================
    const byStation = {};

    data.features.forEach(f => {
      const p = f.properties;
      const key = p.station;

      if (!byStation[key]) {
        byStation[key] = {
          coords: f.geometry.coordinates,
          rows: []
        };
      }
      byStation[key].rows.push(p);
    });

    const layer = L.layerGroup().addTo(map);

    Object.entries(byStation).forEach(([station, s]) => {
      const [lon, lat] = s.coords;

      // aikajärjestys
      s.rows.sort((a, b) => a.time.localeCompare(b.time));

      const temps = s.rows.map(r => r.t2m);
      const latest = s.rows[s.rows.length - 1];

      const marker = L.marker([lat, lon], {
        icon: windArrowIcon(latest.wd, tempColor(latest.t2m))
      });

      const graph = tempSparkline(temps);

      marker.bindPopup(`
        <strong>${station}</strong><br>
        🌡 Nyt: ${latest.t2m ?? "–"} °C<br>
        💨 ${latest.ws ?? "–"} m/s<br><br>
        ${graph}
      `);

      marker.addTo(layer);
    });

    if (layer.getLayers().length > 0) {
      map.fitBounds(layer.getBounds(), { padding: [30,30] });
    }
  })
  .catch(err => console.error("OBS FETCH ERROR", err));

</script>

</body>
</html>
