<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>FMI Sääkartta – Havainnot ja ennuste</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html, body { margin: 0; height: 100%; }
#map { height: 100%; width: 100%; }
</style>
</head>
<body>

<div id="map"></div>

<script>
console.log("SCRIPT STARTED");

// ==========================
// Kartta
// ==========================
const map = L.map("map").setView([60, 25], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap"
}).addTo(map);

// ==========================
// Layerit
// ==========================
const obsLayer = L.layerGroup();
const fcLayer  = L.layerGroup();

obsLayer.addTo(map); // oletuksena päällä

// ==========================
// Layer toggle
// ==========================
L.control.layers(null, {
  "Havainnot (tuuli)": obsLayer,
  "Ennuste (lämpötila)": fcLayer
}).addTo(map);

// ==========================
// Lämpötilavärit
// ==========================
function tempColor(t) {
  if (t == null || isNaN(t)) return "#999";
  if (t <= -20) return "#08306b";
  if (t <= -10) return "#2171b5";
  if (t <= 0)   return "#6baed6";
  if (t <= 10)  return "#fee08b";
  if (t <= 20)  return "#fdae61";
  return "#d73027";
}

// ==========================
// TUULINUOLI (SVG)
// ==========================
function windArrowIcon(dir, color) {
  const rot = (dir ?? 0) - 180;
  return L.divIcon({
    className: "",
    iconSize: [24, 24],
    html: `
      <svg width="24" height="24" viewBox="0 0 100 100"
           style="transform: rotate(${rot}deg)">
        <polygon points="50,0 90,100 50,75 10,100"
                 fill="${color}" />
      </svg>
    `
  });
}

// ==========================
// HAVAINNOT
// ==========================
fetch("observations.json")
  .then(r => r.json())
  .then(data => {
    console.log("OBS FEATURES", data.features.length);

    data.features.forEach(f => {
      const [lon, lat] = f.geometry.coordinates;
      const p = f.properties;

      const marker = L.marker([lat, lon], {
        icon: windArrowIcon(p.wd, tempColor(p.t2m))
      });

      marker.bindPopup(`
        <strong>${p.station}</strong><br>
        🌡 ${p.t2m ?? "–"} °C<br>
        💨 ${p.ws ?? "–"} m/s<br>
        🧭 ${p.wd ?? "–"} °
      `);

      marker.addTo(obsLayer);
    });

    if (obsLayer.getLayers().length > 0) {
      map.fitBounds(obsLayer.getBounds(), { padding: [30, 30] });
    }
  })
  .catch(err => console.error("OBS FETCH ERROR", err));

// ==========================
// ENNUSTE
// ==========================
fetch("forecast.json")
  .then(r => r.json())
  .then(fc => {
    console.log("FC FEATURES", fc.features.length);

    fc.features.forEach(f => {
      const [lon, lat] = f.geometry.coordinates;
      const p = f.properties;

      const m = L.circleMarker([lat, lon], {
        radius: 5,
        color: "#333",
        weight: 1,
        fillColor: tempColor(p.t2m),
        fillOpacity: 0.7
      });

      m.bindPopup(`
        <strong>${p.city}</strong><br>
        🌡 ${p.t2m ?? "–"} °C<br>
        💨 ${p.ws ?? "–"} m/s
      `);

      m.addTo(fcLayer);
    });
  })
  .catch(err => console.error("FC FETCH ERROR", err));
</script>

</body>
</html>
